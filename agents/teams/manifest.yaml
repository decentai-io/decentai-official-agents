schema: 3
agent:
  id: teams
  name: Microsoft Teams
  version: "2.0.0"
  description: >
    Your Microsoft Teams (work or school account) through the assistant. Catch up on what you missed, read a chat or a
    channel, see whether someone answered, and send a message, post to a channel or reply in one on your go-ahead. A
    watch, run on a schedule, hands on each new chat message once.
  instructions: >
    Use this agent for Microsoft Teams. It works only with a work or school account; for a personal Microsoft account
    every function says so, and you pass that on. Several accounts may be connected: pass account (the address) when
    the person names one or the agent says several are connected.
    "What did I miss" is chats_missed (unread chats with what was said, counted in code). Chats are addressed by
    chat_id: find one with chats_list (most recent first; with narrows by a person's address or name), never invent
    one. chats_read reads a chat as text, oldest first; next_page_token reads further back. To message one person, pass
    their email address as to (their one-to-one chat is found or started); resolve a name to an address first, from
    chats_list or by asking. mention (addresses or names of people in the chat) makes @mentions.
    Sending (chats_send), posting to a channel (channels_post) and replying in a channel (channels_reply) leave the
    platform and wait for approval: show the person the exact text and where it goes, and never send what they did not
    see. A send is one request and is never retried: status unknown means no answer came back; say so, and have the
    person check Teams before anything is sent again. A second send of the same words to the same place after an
    unknown one is refused unless the person says to send it again (again: true).
    chats_replies says whether anyone answered a message this agent sent (sent_ref). Teams and channels: teams_list,
    channels_list. Reading channel messages (channels_read, channels_replies) needs a permission only an
    administrator can grant; when refused, say that, and that posting still works.
    To hear about new chat messages, start a watch ONCE (watches_start, one chat or every chat) and schedule
    watches_check; watches_list and watches_close manage them. Ids come from this agent's answers: pass them on
    unchanged.
  examples:
    - {title: What did I miss, prompt: 'What did I miss on Teams today?'}
    - {title: Catch up, prompt: 'What did Dana say in our Teams chat?'}
    - {title: Answer it, prompt: Tell Dana on Teams the drawings are coming Thursday.}
    - {title: Did they answer, prompt: 'Has Dana replied to what I sent her on Teams?'}
    - {title: Post to a channel, prompt: 'Post in the Showroom channel that Northlight now deliver on the 24th, and mention Omar.'}
    - {title: Watch my chats, prompt: Tell me whenever a new Teams chat message arrives.}
  tags: [chat, teams, microsoft, productivity]
network: {hosts: [graph.microsoft.com]}
resources:
  secrets:
    - id: microsoft
      label: Microsoft Account
      description: >
        A Microsoft account, work, school or personal, connected by signing in. Every Microsoft agent in the catalog asks
        for the same permissions, so one saved account can be granted to each of them. The platform keeps and refreshes
        the tokens; this agent receives a short-lived access token and the address. An account connected before this
        version needs one reconnect to add the new permissions. api_base_url is for tests only; leave it empty.
      binding: {cardinality: many, required: true}
      oauth:
        provider: microsoft
        authorize_url: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
        token_url: https://login.microsoftonline.com/common/oauth2/v2.0/token
        scopes:
          - openid
          - email
          - offline_access
          - User.Read
          - Mail.ReadWrite
          - Mail.Send
          - MailboxSettings.Read
          - Calendars.ReadWrite
          - Files.ReadWrite.All
          - Chat.ReadWrite
          - Team.ReadBasic.All
          - Channel.ReadBasic.All
          - ChannelMessage.Send
          - Tasks.ReadWrite
        identity: {url: 'https://graph.microsoft.com/v1.0/me', field: userPrincipalName}
      fields:
        - name: api_base_url
          label: API Base URL (tests only)
          type: string
          storage: keys
          required: false
  data:
    - id: sent
      label: Sent Message
      description: >
        Every chat message, channel post and channel reply this agent tried to send, where, and what became of it:
        sending (asked, no answer yet), sent, unknown (no answer came), failed (refused; nothing was sent).
      binding: {cardinality: many, required: false}
      fields:
        - {name: kind, label: Kind, type: select, storage: keys, required: true, options: [chat, channel, reply]}
        - {name: chat_id, label: Chat or Channel ID, type: string, storage: keys, required: true}
        - {name: team_id, label: Team ID, type: string, storage: keys, required: false}
        - {name: parent_id, label: Replied To, type: string, storage: keys, required: false}
        - name: status
          label: Status
          type: select
          storage: keys
          required: true
          options: [sending, sent, unknown, failed]
        - {name: digest, label: Words Fingerprint, type: string, storage: keys, required: true}
        - {name: attempted_at, label: Attempted At, type: string, storage: keys, required: true}
        - {name: account, label: Account, type: string, storage: keys, required: false}
        - {name: message_id, label: Message ID, type: string, storage: keys, required: false}
        - {name: sent_at, label: Sent At, type: string, storage: keys, required: false}
        - {name: to, label: To, type: string, storage: values, required: true}
        - {name: text, label: Text, type: string, storage: values, required: true}
        - {name: link, label: Link, type: string, storage: values, required: false}
    - id: watch
      label: Chat Watch
      description: A chat, or every chat, watched for new messages, and how far it has been read.
      binding: {cardinality: many, required: false}
      fields:
        - {name: kind, label: Kind, type: select, storage: keys, required: true, options: [chat, chats]}
        - {name: chat_id, label: Chat ID, type: string, storage: keys, required: false}
        - {name: status, label: Status, type: select, storage: keys, required: true, options: [active, closed]}
        - {name: cursor, label: Read Up To, type: string, storage: keys, required: true}
        - {name: account, label: Account, type: string, storage: keys, required: false}
        - {name: note, label: Note, type: string, storage: values, required: false}
functions:
  - id: account_status
    name: Teams Status
    description: Confirm the connection, say whose account it is, and whether it can use Teams (work or school only).
    level: 0
    timeout_seconds: 30
    calls: ['record.list:microsoft', 'record.read:microsoft']
    inputs: {type: object, additionalProperties: false, properties: {account: {type: string, maxLength: 200}}}
    outputs:
      type: object
      required: [connected, email]
      properties:
        connected: {type: boolean}
        email: {type: string}
        name: {type: string}
        problem: {type: string}
        accounts: {type: array, items: {type: string}}
  - id: chats_list
    name: List Chats
    description: >
      The account's chats, most recent message first (one-to-one, group and meeting chats), each with who is in it, its
      last message and whether it is unread. with narrows to chats with that person (address or name).
      next_page_token continues.
    level: 0
    timeout_seconds: 60
    calls: ['record.list:microsoft', 'record.read:microsoft', 'record.create:microsoft']
    inputs:
      type: object
      additionalProperties: false
      properties:
        account: {type: string, maxLength: 200}
        with: {type: string, maxLength: 200}
        max_results: {type: integer, minimum: 1, maximum: 50, default: 20}
        page_token: {type: string, maxLength: 4000}
    outputs:
      type: object
      required: [chats]
      properties:
        chats: {type: array, items: {type: object}}
        next_page_token: {type: string}
  - id: chats_read
    name: Read Chat
    description: >
      A chat's latest messages as text, oldest first, system notices left out; up to 200 at once. next_page_token reads
      the messages before them.
    level: 0
    timeout_seconds: 60
    calls: ['record.list:microsoft', 'record.read:microsoft', 'record.create:microsoft']
    inputs:
      type: object
      additionalProperties: false
      required: [chat_id]
      properties:
        account: {type: string, maxLength: 200}
        chat_id: {type: string, minLength: 1, maxLength: 400}
        max_results: {type: integer, minimum: 1, maximum: 200, default: 30}
        page_token: {type: string, maxLength: 4000}
    outputs:
      type: object
      required: [chat_id, messages]
      properties:
        chat_id: {type: string}
        topic: {type: string}
        messages: {type: array, items: {type: object}}
        next_page_token: {type: string}
  - id: chats_missed
    name: What Did I Miss
    description: >
      Chats with messages from others in the last hours (24 by default): unread ones only, unless unread_only is false.
      Each chat with how many new messages and what they said, counted and read here.
    level: 0
    timeout_seconds: 90
    calls: ['record.list:microsoft', 'record.read:microsoft', 'record.create:microsoft']
    inputs:
      type: object
      additionalProperties: false
      properties:
        account: {type: string, maxLength: 200}
        hours: {type: integer, minimum: 1, maximum: 168, default: 24}
        unread_only: {type: boolean, default: true}
        max_chats: {type: integer, minimum: 1, maximum: 25, default: 10}
    outputs:
      type: object
      required: [since, chats]
      properties:
        since: {type: string}
        unread_only: {type: boolean}
        chats: {type: array, items: {type: object}}
        chats_not_read: {type: integer}
  - id: chats_send
    name: Send Chat Message
    description: >
      Send text to a chat (chat_id), or to one person by email address (to): their one-to-one chat, started if there is
      none. mention @mentions people in the chat. One request, never retried; status unknown when no answer came. It
      leaves the platform: only on the person's go-ahead, with the exact text they saw.
    level: 3
    timeout_seconds: 120
    calls:
      - record.list:microsoft
      - record.read:microsoft
      - record.create:microsoft
      - record.list:sent
      - record.create:sent
      - record.update:sent
    inputs:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        account: {type: string, maxLength: 200}
        text: {type: string, minLength: 1, maxLength: 4000}
        chat_id: {type: string, maxLength: 400}
        to: {type: string, maxLength: 200}
        mention: {type: array, maxItems: 10, items: {type: string, maxLength: 200}}
        again: {type: boolean, default: false}
    outputs:
      type: object
      required: [status, sent_ref, chat_id]
      properties:
        status: {type: string, enum: [sent, unknown]}
        already: {type: boolean}
        sent_ref: {type: string}
        chat_id: {type: string}
        message_id: {type: string}
        sent_at: {type: string}
        link: {type: string}
        problem: {type: string}
  - id: chats_replies
    name: Replies
    description: >
      Whether anyone answered a message this agent sent (sent_ref): a chat message, a channel post or a channel reply;
      and what they said.
    level: 0
    timeout_seconds: 90
    calls: ['record.list:microsoft', 'record.read:microsoft', 'record.create:microsoft', 'record.read:sent']
    inputs:
      type: object
      additionalProperties: false
      required: [sent_ref]
      properties: {account: {type: string, maxLength: 200}, sent_ref: {type: string, minLength: 1, maxLength: 100}}
    outputs:
      type: object
      required: [replied, replies]
      properties: {replied: {type: boolean}, chat_id: {type: string}, replies: {type: array, items: {type: object}}}
  - id: teams_list
    name: List Teams
    description: The teams the account is a member of.
    level: 0
    timeout_seconds: 45
    calls: ['record.list:microsoft', 'record.read:microsoft', 'record.create:microsoft']
    inputs: {type: object, additionalProperties: false, properties: {account: {type: string, maxLength: 200}}}
    outputs: {type: object, required: [teams], properties: {teams: {type: array, items: {type: object}}}}
  - id: channels_list
    name: List Channels
    description: A team's channels.
    level: 0
    timeout_seconds: 45
    calls: ['record.list:microsoft', 'record.read:microsoft', 'record.create:microsoft']
    inputs:
      type: object
      additionalProperties: false
      required: [team_id]
      properties: {account: {type: string, maxLength: 200}, team_id: {type: string, minLength: 1, maxLength: 200}}
    outputs: {type: object, required: [channels], properties: {channels: {type: array, items: {type: object}}}}
  - id: channels_read
    name: Read Channel
    description: >
      A channel's latest posts as text, oldest first; next_page_token reads further back. Needs a permission an
      administrator grants; refused without it.
    level: 0
    timeout_seconds: 60
    calls: ['record.list:microsoft', 'record.read:microsoft', 'record.create:microsoft']
    inputs:
      type: object
      additionalProperties: false
      required: [team_id, channel_id]
      properties:
        account: {type: string, maxLength: 200}
        team_id: {type: string, minLength: 1, maxLength: 200}
        channel_id: {type: string, minLength: 1, maxLength: 400}
        max_results: {type: integer, minimum: 1, maximum: 200, default: 20}
        page_token: {type: string, maxLength: 4000}
    outputs:
      type: object
      required: [messages]
      properties:
        team_id: {type: string}
        channel_id: {type: string}
        messages: {type: array, items: {type: object}}
        next_page_token: {type: string}
  - id: channels_replies
    name: Read Channel Replies
    description: Every reply to one channel post, oldest first. Needs a permission an administrator grants.
    level: 0
    timeout_seconds: 60
    calls: ['record.list:microsoft', 'record.read:microsoft', 'record.create:microsoft']
    inputs:
      type: object
      additionalProperties: false
      required: [team_id, channel_id, message_id]
      properties:
        account: {type: string, maxLength: 200}
        team_id: {type: string, minLength: 1, maxLength: 200}
        channel_id: {type: string, minLength: 1, maxLength: 400}
        message_id: {type: string, minLength: 1, maxLength: 100}
    outputs:
      type: object
      required: [replies]
      properties: {message_id: {type: string}, replies: {type: array, items: {type: object}}}
  - id: channels_post
    name: Post to Channel
    description: >
      Post text, with an optional subject, to a team's channel; mention @mentions people found in the account's chats.
      One request, never retried. It leaves the platform: only on the person's go-ahead, with the exact text they saw.
    level: 3
    timeout_seconds: 120
    calls: &channel_send
      - record.list:microsoft
      - record.read:microsoft
      - record.create:microsoft
      - record.list:sent
      - record.create:sent
      - record.update:sent
    inputs:
      type: object
      additionalProperties: false
      required: [team_id, channel_id, text]
      properties:
        account: {type: string, maxLength: 200}
        team_id: {type: string, minLength: 1, maxLength: 200}
        channel_id: {type: string, minLength: 1, maxLength: 400}
        text: {type: string, minLength: 1, maxLength: 4000}
        subject: {type: string, maxLength: 200}
        mention: {type: array, maxItems: 10, items: {type: string, maxLength: 200}}
        again: {type: boolean, default: false}
    outputs: &sent_output
      type: object
      required: [status, sent_ref]
      properties:
        status: {type: string, enum: [sent, unknown]}
        already: {type: boolean}
        sent_ref: {type: string}
        chat_id: {type: string}
        team_id: {type: string}
        parent_id: {type: string}
        message_id: {type: string}
        sent_at: {type: string}
        link: {type: string}
        problem: {type: string}
  - id: channels_reply
    name: Reply in Channel
    description: >
      Reply to a channel post (message_id) in its thread. One request, never retried. It leaves the platform: only on
      the person's go-ahead, with the exact text they saw.
    level: 3
    timeout_seconds: 120
    calls: *channel_send
    inputs:
      type: object
      additionalProperties: false
      required: [team_id, channel_id, message_id, text]
      properties:
        account: {type: string, maxLength: 200}
        team_id: {type: string, minLength: 1, maxLength: 200}
        channel_id: {type: string, minLength: 1, maxLength: 400}
        message_id: {type: string, minLength: 1, maxLength: 100}
        text: {type: string, minLength: 1, maxLength: 4000}
        mention: {type: array, maxItems: 10, items: {type: string, maxLength: 200}}
        again: {type: boolean, default: false}
    outputs: *sent_output
  - id: watches_start
    name: Watch Chats
    description: >
      Start watching one chat (chat_id) or every chat (none) for new messages from others, from now. Record it once,
      then schedule watches_check.
    level: 1
    timeout_seconds: 45
    calls: ['record.list:microsoft', 'record.read:microsoft', 'record.create:microsoft', 'record.create:watch']
    inputs:
      type: object
      additionalProperties: false
      properties:
        account: {type: string, maxLength: 200}
        chat_id: {type: string, maxLength: 400}
        note: {type: string, maxLength: 500}
    outputs:
      type: object
      required: [watch_ref, kind, since]
      properties: {watch_ref: {type: string}, kind: {type: string}, since: {type: string}}
  - id: watches_check
    name: New Chat Messages
    description: >
      Every new message from others since the last check, for every active watch (or one, by watch_ref), oldest first,
      each once. A watch that fails is listed in problems and keeps its place; one whose chat is gone is closed.
      Schedulable: a run with nothing in messages has nothing to report.
    level: 1
    timeout_seconds: 120
    schedulable: true
    calls: ['record.list:microsoft', 'record.read:microsoft', 'record.list:watch', 'record.read:watch',
            'record.update:watch']
    inputs:
      type: object
      additionalProperties: false
      properties: {watch_ref: {type: string, maxLength: 100}}
    outputs:
      type: object
      required: [checked, messages, problems, closed, more]
      properties:
        checked: {type: integer}
        messages: {type: array, items: {type: object}}
        problems: {type: array, items: {type: object}}
        closed: {type: array, items: {type: object}}
        more: {type: boolean}
  - id: watches_list
    name: List Watches
    description: The chat watches, active ones unless include_closed.
    level: 0
    timeout_seconds: 30
    calls: ['record.list:watch']
    inputs:
      type: object
      additionalProperties: false
      properties: {include_closed: {type: boolean, default: false}}
    outputs: {type: object, required: [watches], properties: {watches: {type: array, items: {type: object}}}}
  - id: watches_close
    name: Stop a Watch
    description: Stop a watch for good; a scheduled check hears nothing more from it.
    level: 1
    timeout_seconds: 30
    calls: ['record.read:watch', 'record.update:watch']
    inputs:
      type: object
      additionalProperties: false
      required: [watch_ref]
      properties: {watch_ref: {type: string, minLength: 1, maxLength: 100}}
    outputs:
      type: object
      required: [watch_ref, closed]
      properties: {watch_ref: {type: string}, closed: {type: boolean}, already: {type: boolean}}
