schema: 3
agent:
  id: todoist
  name: Todoist
  version: "1.1.0"
  description: >
    Your Todoist, read and kept through the assistant. See what is due today or overdue, add a task or a sub-task to the
    right project with a date and a priority, move it, tick it off or change its date, and have what you completed in
    Todoist, recurring tasks included, carried into your other lists on a schedule.
  instructions: >
    Use this agent when the user wants to see, add, change, move or finish tasks in their Todoist. Projects, sections and
    labels are Todoist's own: pass a name the user said or an id a list returned, and when a function refuses a name it
    lists the real ones; ask the user which they meant, never invent an id, a project, a section or a label. With several
    Todoist accounts connected, pass account (the account's address) to every function. Priorities are the app's words:
    P1 is the most urgent, P4 the default. Dates: due_string takes Todoist's own words ("tomorrow", "every Monday"),
    due_date takes YYYY-MM-DD. For "today", "overdue", "this week" or anything Todoist's filter language says, use
    tasks_list with query (e.g. "today | overdue", "#Office Move & @calls", "p1"); Todoist reads "today" in the account's
    own time zone. A task list is at most 25 per answer; continue with cursor when more is true. A sub-task is a task
    with parent_id: create one with tasks_create and parent_id, list a task's sub-tasks with tasks_list and parent_id.
    tasks_move moves a task to exactly one of a project, a section, or under another task (parent_id). Completing a
    recurring task moves it to its next date instead of finishing it; say so. Deleting a task and adding a comment (which
    everyone the project is shared with sees) need the user's explicit go-ahead. Keeping Todoist and the platform's Tasks
    list in step is two agents' work, done by you: read a task from one and create it in the other with the same title
    and due date, naming where it came from (the Todoist link as the Tasks item's source). To carry over what was ticked
    off in Todoist, record ONE completion watch (sync_watch, optionally for one project) and schedule sync_completed;
    each check hands on only what was completed since the last, oldest first, recurring completions included when
    sync_watch said recurring_seen. Find the matching open Tasks item (same title, or its source is the task's link) and
    mark it done with the Todoist link as its evidence; when nothing matches, say so rather than guessing. A check's
    problems name watches that could not be read this time (they keep their place); closed names watches whose project
    is gone. watches_list shows the watches, watches_close stops one. Never record a second watch for the same request.
    Task ids and links are Todoist's own: pass them on unchanged.
  examples:
    - {title: What is due, prompt: 'What is due today or overdue in my Todoist?'}
    - title: Add a task
      prompt: Add "Order twenty desk chairs" to my Office Move project, due next Friday, priority 1, labelled calls.
    - title: Break it down
      prompt: Under "Order twenty desk chairs" in Todoist, add sub-tasks to get three quotes and to book the delivery.
    - title: Move it
      prompt: Move "Chase the Northlight quote" in Todoist into the Office Move project.
    - title: Keep lists in step
      prompt: Every hour, check what I completed in Todoist and mark the matching items done in my Tasks list.
  tags: [tasks, to-do, todoist, productivity]
network: {hosts: [api.todoist.com]}
resources:
  secrets:
    - id: todoist
      label: Todoist Account
      description: >
        A Todoist account, connected by signing in. Several may be connected; a function names one by its address.
        api_base_url is for tests only; leave it empty.
      binding: {cardinality: many, required: true}
      oauth:
        provider: todoist
        authorize_url: https://app.todoist.com/oauth/authorize
        token_url: https://api.todoist.com/oauth/access_token
        scope_separator: ','
        scopes: ['data:read_write', 'data:delete']
        identity: {url: 'https://api.todoist.com/api/v1/user', field: email}
      fields:
        - name: api_base_url
          label: API Base URL (tests only)
          type: string
          storage: keys
          required: false
  data:
    - id: watch
      label: Completion Watch
      description: >
        How far Todoist's completions have been handed on: the time of the newest completion seen (Todoist's clock, UTC),
        the ids that sit exactly on that time, where completions are read (the activity log, or completed tasks when the
        plan has no activity log), the account, and which project counts (empty for all).
      binding: {cardinality: many, required: false}
      fields:
        - {name: since, label: Read Up To, type: string, storage: keys, required: true}
        - {name: cursor_ids, label: Ids At That Time, type: string, storage: keys, required: false}
        - name: status
          label: Status
          type: select
          storage: keys
          required: true
          options: [active, watching, closed]
        - name: source
          label: Read From
          type: select
          storage: keys
          required: false
          options: [activity, completed]
        - {name: account, label: Account, type: string, storage: keys, required: false}
        - {name: project_id, label: Project ID, type: string, storage: keys, required: false}
        - {name: project, label: Project, type: string, storage: keys, required: false}
        - {name: note, label: Note, type: string, storage: values, required: false}
functions:
  - id: account_status
    name: Account Status
    description: Confirm the Todoist connection works, whose it is, and its time zone.
    level: 0
    timeout_seconds: 30
    calls: ['record.list:todoist', 'record.read:todoist']
    inputs:
      type: object
      additionalProperties: false
      properties: {account: {type: string, maxLength: 200}}
    outputs:
      type: object
      required: [connected, email]
      properties:
        connected: {type: boolean}
        email: {type: string}
        full_name: {type: string}
        timezone: {type: string}
        problem: {type: string}
  - id: projects_list
    name: List Projects
    description: >
      Every active project with its id, parent, whether it is shared with other people, whether it is the Inbox, and a link.
    level: 0
    timeout_seconds: 45
    calls: ['record.list:todoist', 'record.read:todoist', 'record.create:todoist']
    inputs:
      type: object
      additionalProperties: false
      properties: {account: {type: string, maxLength: 200}}
    outputs:
      type: object
      required: [projects, total]
      properties:
        total: {type: integer}
        projects:
          type: array
          items:
            type: object
            properties: &project_fields
              project_id: {type: string}
              name: {type: string}
              parent_id: {type: string}
              shared: {type: boolean}
              inbox: {type: boolean}
              link: {type: string}
  - id: projects_create
    name: Create Project
    description: >
      A new project in the person's Todoist, optionally inside an existing parent project (by name or id).
    level: 2
    timeout_seconds: 45
    calls: ['record.list:todoist', 'record.read:todoist', 'record.create:todoist']
    inputs:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        parent: {type: string, maxLength: 120}
        account: {type: string, maxLength: 200}
    outputs: {type: object, required: [project_id, name], properties: *project_fields}
  - id: sections_list
    name: List Sections
    description: Sections of one project (by name or id), or of every project.
    level: 0
    timeout_seconds: 45
    calls: ['record.list:todoist', 'record.read:todoist', 'record.create:todoist']
    inputs:
      type: object
      additionalProperties: false
      properties: {project: {type: string, maxLength: 120}, account: {type: string, maxLength: 200}}
    outputs:
      type: object
      required: [sections, total]
      properties:
        total: {type: integer}
        sections:
          type: array
          items:
            type: object
            properties:
              section_id: {type: string}
              name: {type: string}
              project_id: {type: string}
              project: {type: string}
  - id: labels_list
    name: List Labels
    description: The person's own labels, by name.
    level: 0
    timeout_seconds: 45
    calls: ['record.list:todoist', 'record.read:todoist', 'record.create:todoist']
    inputs:
      type: object
      additionalProperties: false
      properties: {account: {type: string, maxLength: 200}}
    outputs:
      type: object
      required: [labels, total]
      properties:
        total: {type: integer}
        labels: {type: array, items: {type: object, properties: {label_id: {type: string}, name: {type: string}}}}
  - id: tasks_list
    name: List Tasks
    description: >
      Open tasks, at most max_results (25) per answer: all of them, or by project, section and label (names or ids), or
      a task's sub-tasks (parent_id), or by a Todoist filter query such as "today | overdue"; a query is given alone. Each
      row has its due date and Todoist's due words, priority as the app shows it (P1 most urgent), labels, project name,
      parent and link. When more is true, pass next_cursor as cursor to continue.
    level: 0
    timeout_seconds: 60
    calls: ['record.list:todoist', 'record.read:todoist', 'record.create:todoist']
    inputs:
      type: object
      additionalProperties: false
      properties:
        project: {type: string, maxLength: 120}
        section: {type: string, maxLength: 120}
        label: {type: string, maxLength: 120}
        parent_id: {type: string, maxLength: 100}
        query: {type: string, maxLength: 1024}
        max_results: {type: integer, minimum: 1, maximum: 25, default: 20}
        cursor: {type: string, maxLength: 500}
        account: {type: string, maxLength: 200}
    outputs:
      type: object
      required: [tasks, more]
      properties:
        more: {type: boolean}
        next_cursor: {type: string}
        tasks:
          type: array
          items:
            type: object
            properties: &task_fields
              task_id: {type: string}
              content: {type: string}
              project_id: {type: string}
              project: {type: string}
              section_id: {type: string}
              parent_id: {type: string}
              labels: {type: array, items: {type: string}}
              priority: {type: string}
              due_date: {type: string}
              due_string: {type: string}
              recurring: {type: boolean}
              link: {type: string}
  - id: tasks_get
    name: Get Task
    description: One task with its description, its open sub-tasks, how many comments it has, and whether it is completed.
    level: 0
    timeout_seconds: 45
    calls: ['record.list:todoist', 'record.read:todoist', 'record.create:todoist']
    inputs:
      type: object
      additionalProperties: false
      required: [task_id]
      properties: {task_id: {type: string, minLength: 1, maxLength: 100}, account: {type: string, maxLength: 200}}
    outputs:
      type: object
      required: [task_id, content, completed, comment_count]
      properties:
        task_id: {type: string}
        content: {type: string}
        description: {type: string}
        project_id: {type: string}
        project: {type: string}
        section_id: {type: string}
        parent_id: {type: string}
        labels: {type: array, items: {type: string}}
        priority: {type: string}
        due_date: {type: string}
        due_string: {type: string}
        recurring: {type: boolean}
        completed: {type: boolean}
        added_at: {type: string}
        comment_count: {type: integer}
        subtasks:
          type: array
          items: {type: object, properties: {task_id: {type: string}, content: {type: string}}}
        link: {type: string}
  - id: tasks_create
    name: Create Task
    description: >
      Add a task to the person's Todoist: content, and optionally a description, project and section (names or ids that
      exist; an unknown one is refused with the real ones listed; none means the Inbox), or parent_id to make it a
      sub-task of that task (it goes where its parent is), due_string (Todoist's words) or due_date (YYYY-MM-DD),
      priority P1–P4, and labels that exist.
    level: 2
    timeout_seconds: 60
    calls: ['record.list:todoist', 'record.read:todoist', 'record.create:todoist']
    inputs:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: {type: string, minLength: 1, maxLength: 500}
        description: {type: string, maxLength: 4000}
        project: {type: string, maxLength: 120}
        section: {type: string, maxLength: 120}
        parent_id: {type: string, maxLength: 100}
        due_string: {type: string, maxLength: 100}
        due_date: {type: string, maxLength: 10}
        priority: {type: string, enum: [P1, P2, P3, P4]}
        labels: {type: array, maxItems: 10, items: {type: string, maxLength: 60}}
        account: {type: string, maxLength: 200}
    outputs: {type: object, required: [task_id, content], properties: *task_fields}
  - id: tasks_update
    name: Update Task
    description: >
      Change a task's content, description, due (due_string, or due_string "no date" to clear it, or due_date), priority
      or labels (the whole new set, labels that exist). To put it elsewhere, use tasks_move.
    level: 2
    timeout_seconds: 60
    calls: ['record.list:todoist', 'record.read:todoist', 'record.create:todoist']
    inputs:
      type: object
      additionalProperties: false
      required: [task_id]
      properties:
        task_id: {type: string, minLength: 1, maxLength: 100}
        content: {type: string, maxLength: 500}
        description: {type: string, maxLength: 4000}
        due_string: {type: string, maxLength: 100}
        due_date: {type: string, maxLength: 10}
        priority: {type: string, enum: [P1, P2, P3, P4]}
        labels: {type: array, maxItems: 10, items: {type: string, maxLength: 60}}
        account: {type: string, maxLength: 200}
    outputs: {type: object, required: [task_id, content], properties: *task_fields}
  - id: tasks_move
    name: Move Task
    description: >
      Move a task, with its sub-tasks, to exactly one of: another project (name or id), a section (name or id; name its
      project in section_project when two projects have a section of that name), or under another task (parent_id).
    level: 2
    timeout_seconds: 60
    calls: ['record.list:todoist', 'record.read:todoist', 'record.create:todoist']
    inputs:
      type: object
      additionalProperties: false
      required: [task_id]
      properties:
        task_id: {type: string, minLength: 1, maxLength: 100}
        project: {type: string, maxLength: 120}
        section: {type: string, maxLength: 120}
        section_project: {type: string, maxLength: 120}
        parent_id: {type: string, maxLength: 100}
        account: {type: string, maxLength: 200}
    outputs: {type: object, required: [task_id, content], properties: *task_fields}
  - id: tasks_complete
    name: Complete Task
    description: >
      Tick a task off. A recurring task moves to its next date instead (recurring is true); already says it was completed
      before.
    level: 2
    timeout_seconds: 45
    calls: ['record.list:todoist', 'record.read:todoist', 'record.create:todoist']
    inputs:
      type: object
      additionalProperties: false
      required: [task_id]
      properties: {task_id: {type: string, minLength: 1, maxLength: 100}, account: {type: string, maxLength: 200}}
    outputs:
      type: object
      required: [task_id, completed]
      properties:
        task_id: {type: string}
        content: {type: string}
        completed: {type: boolean}
        already: {type: boolean}
        recurring: {type: boolean}
  - id: tasks_reopen
    name: Reopen Task
    description: Put a completed task back on the list.
    level: 2
    timeout_seconds: 45
    calls: ['record.list:todoist', 'record.read:todoist', 'record.create:todoist']
    inputs:
      type: object
      additionalProperties: false
      required: [task_id]
      properties: {task_id: {type: string, minLength: 1, maxLength: 100}, account: {type: string, maxLength: 200}}
    outputs:
      type: object
      required: [task_id, reopened]
      properties: {task_id: {type: string}, reopened: {type: boolean}}
  - id: tasks_delete
    name: Delete Task
    description: Delete a task and its sub-tasks for good. Only on the user's explicit go-ahead.
    level: 3
    timeout_seconds: 45
    calls: ['record.list:todoist', 'record.read:todoist', 'record.create:todoist']
    inputs:
      type: object
      additionalProperties: false
      required: [task_id]
      properties: {task_id: {type: string, minLength: 1, maxLength: 100}, account: {type: string, maxLength: 200}}
    outputs:
      type: object
      required: [task_id, deleted]
      properties: {task_id: {type: string}, content: {type: string}, deleted: {type: boolean}}
  - id: comments_add
    name: Add Comment
    description: >
      Comment on a task. Everyone the task's project is shared with sees it; only on the user's explicit go-ahead.
    level: 3
    timeout_seconds: 45
    calls: ['record.list:todoist', 'record.read:todoist', 'record.create:todoist']
    inputs:
      type: object
      additionalProperties: false
      required: [task_id, content]
      properties:
        task_id: {type: string, minLength: 1, maxLength: 100}
        content: {type: string, minLength: 1, maxLength: 4000}
        account: {type: string, maxLength: 200}
    outputs:
      type: object
      required: [comment_id, task_id]
      properties:
        comment_id: {type: string}
        task_id: {type: string}
        task: {type: string}
        posted_at: {type: string}
        link: {type: string}
  - id: sync_watch
    name: Watch Completions
    description: >
      Start watching what is completed in Todoist, recurring tasks included where the plan has an activity log: in every
      project, or one (by name or id); from now, or from since (an ISO 8601 date-time; one with no offset is in
      timezone, an IANA zone, or else the account's own). Record it once, then schedule sync_completed.
    level: 1
    timeout_seconds: 60
    calls: ['record.list:todoist', 'record.read:todoist', 'record.create:todoist', 'record.create:watch']
    inputs:
      type: object
      additionalProperties: false
      properties:
        project: {type: string, maxLength: 120}
        since: {type: string, maxLength: 40}
        timezone: {type: string, maxLength: 64}
        note: {type: string, maxLength: 500}
        account: {type: string, maxLength: 200}
    outputs:
      type: object
      required: [watch_ref, since, source, recurring_seen]
      properties:
        watch_ref: {type: string}
        since: {type: string}
        project: {type: string}
        source: {type: string}
        recurring_seen: {type: boolean}
        warning: {type: string}
  - id: sync_completed
    name: Completed Since
    description: >
      What was completed in Todoist since the last check, for every watch (or one, by watch_ref; or one account's): one
      row per completion, oldest first, shaped like tasks_list, with its completion time, each naming its watch. A
      recurring task's row has next_due_date, its next occurrence. Moves each watch forward; more says a later check
      continues; problems lists watches that could not be read (they keep their place); closed lists watches whose
      project is gone. Safe to schedule: it reads and records only.
    level: 1
    timeout_seconds: 120
    schedulable: true
    calls:
      - record.list:todoist
      - record.read:todoist
      - record.list:watch
      - record.read:watch
      - record.update:watch
    inputs:
      type: object
      additionalProperties: false
      properties:
        watch_ref: {type: string, maxLength: 100}
        max_results: {type: integer, minimum: 1, maximum: 25, default: 20}
        account: {type: string, maxLength: 200}
    outputs:
      type: object
      required: [checked, completed, more, problems, closed]
      properties:
        checked: {type: integer}
        more: {type: boolean}
        completed:
          type: array
          items:
            type: object
            properties:
              watch_ref: {type: string}
              task_id: {type: string}
              content: {type: string}
              project_id: {type: string}
              project: {type: string}
              section_id: {type: string}
              parent_id: {type: string}
              labels: {type: array, items: {type: string}}
              priority: {type: string}
              due_date: {type: string}
              next_due_date: {type: string}
              due_string: {type: string}
              recurring: {type: boolean}
              completed_at: {type: string}
              link: {type: string}
        problems:
          type: array
          items:
            type: object
            properties: {watch_ref: {type: string}, watch: {type: string}, kind: {type: string}, error: {type: string}}
        closed:
          type: array
          items:
            type: object
            properties: {watch_ref: {type: string}, watch: {type: string}, why: {type: string}}
  - id: watches_list
    name: List Watches
    description: The completion watches, each with its project, account, where it reads from and how far it has read.
    level: 0
    timeout_seconds: 30
    calls: ['record.list:watch']
    inputs:
      type: object
      additionalProperties: false
      properties: {include_closed: {type: boolean, default: false}, account: {type: string, maxLength: 200}}
    outputs:
      type: object
      required: [watches, total]
      properties:
        total: {type: integer}
        watches:
          type: array
          items:
            type: object
            properties:
              watch_ref: {type: string}
              status: {type: string}
              project: {type: string}
              account: {type: string}
              since: {type: string}
              source: {type: string}
  - id: watches_close
    name: Stop Watch
    description: Stop a completion watch for good (by watch_ref, from watches_list); a schedule hears nothing more from it.
    level: 1
    timeout_seconds: 30
    calls: ['record.read:watch', 'record.update:watch']
    inputs:
      type: object
      additionalProperties: false
      required: [watch_ref]
      properties: {watch_ref: {type: string, minLength: 1, maxLength: 100}, account: {type: string, maxLength: 200}}
    outputs:
      type: object
      required: [watch_ref, closed]
      properties: {watch_ref: {type: string}, closed: {type: boolean}, already: {type: boolean}}
