schema: 3
agent:
  id: json_data
  name: JSON
  version: "1.0.0"
  description: >
    Reads the JSON and JSON Lines files you upload: what is inside them, which keys the records actually have and which
    are missing, the values at a path, whether they match a schema, what changed between two versions, and a CSV you can
    open in a spreadsheet.
  instructions: >
    Use this agent whenever the user attached a JSON, JSON Lines or CSV file, or wants one produced. Start with read_inspect:
    it says whether the file parses, how many records there are, and the key map — every path the records actually use,
    how many records have it, and the types seen. Trust the key map over any assumption about shape. Use read_select with
    a path to pull values out; paths are a.b, a[0], a[*] and *, and the root is $. check_validate needs a JSON Schema, either
    inline or as an attached file; report the errors it returns with their paths and do not describe a file as valid unless
    it says so. compare_versions is deterministic — use it before saying what changed between two files. shape_to_table
    writes a CSV and shape_to_json writes a JSON file; both give you a file_ref to hand to the user or to another agent.
    Never retype data from a file into an answer from memory: read it.
  examples:
    - title: What is in this file
      prompt: 'Inspect this JSON export: how many records, and which fields are missing from some of them?'
    - title: Check against a schema
      prompt: Validate every record in this file against the attached schema and list what fails.
    - title: Make it a spreadsheet
      prompt: Turn the orders in this JSON into a CSV with the customer, the total and the date.
  tags: [json, data, integration, productivity]
network: {hosts: []}
resources:
  data:
    - id: validation
      label: Validation
      description: A file checked against a schema, and what failed.
      binding: {cardinality: many, required: false}
      fields:
        - {name: file_ref, label: Source File, type: string, storage: keys, required: true}
        - {name: filename, label: Filename, type: string, storage: keys, required: false}
        - {name: valid, label: Valid, type: select, storage: keys, required: true, options: ['yes', 'no']}
        - {name: checked, label: Checked, type: number, storage: keys, required: true}
        - {name: failures, label: Failures, type: number, storage: keys, required: true}
        - {name: errors, label: Errors, type: object, storage: values, required: false}
    - id: output
      label: Produced File
      description: A file this agent produced, and what it was made from.
      binding: {cardinality: many, required: false}
      fields:
        - {name: kind, label: Kind, type: select, storage: keys, required: true, options: [csv, json]}
        - {name: filename, label: Filename, type: string, storage: keys, required: true}
        - {name: source, label: Source File, type: string, storage: keys, required: false}
        - {name: rows, label: Rows, type: number, storage: keys, required: false}
  files:
    - id: source
      label: Source File
      description: A JSON, JSON Lines or CSV file to read, or a schema to check against.
      binding: {cardinality: many, required: false}
      constraints:
        mime_types: [application/json, application/x-ndjson, text/json, text/plain, text/csv]
        max_size_mb: 25
functions:
  - id: read_inspect
    name: Inspect File
    description: >
      What the file is and what is actually in it: JSON or JSON Lines, the top-level type, how many records, how deep it
      nests, and the key map — every path the records use, how many records have it, the types seen at it, and one example
      value. A file that does not parse is reported with the line and column where parsing stopped.
    level: 0
    timeout_seconds: 60
    calls: ['record.read:source']
    inputs:
      type: object
      additionalProperties: false
      required: [file_ref]
      properties:
        file_ref: {type: string}
        max_records: {type: integer, minimum: 1, maximum: 50000, default: 5000}
    outputs:
      type: object
      required: [file_ref, filename, kind, valid, top_level, records, keys]
      properties:
        file_ref: {type: string}
        filename: {type: string}
        kind: {type: string, enum: [json, jsonl, csv, unsupported]}
        valid: {type: boolean}
        top_level: {type: string, enum: [object, array, string, number, boolean, 'null', none]}
        records: {type: integer}
        scanned: {type: integer}
        depth: {type: integer}
        bytes: {type: integer}
        keys:
          type: array
          items:
            type: object
            properties:
              path: {type: string}
              present: {type: integer}
              types: {type: array, items: {type: string}}
              example: {type: string}
        keys_truncated: {type: boolean}
        problem: {type: string}
        error_line: {type: integer}
        error_column: {type: integer}
  - id: read_select
    name: Select By Path
    description: >
      The values at a path. A path is written a.b for nested keys, a[0] for one item, a[*] for every item, * for every value
      of an object, and $ for the whole document. Each match comes back with the exact path it was found at. A value too
      large to return whole is cut and marked truncated.
    level: 0
    timeout_seconds: 60
    calls: ['record.read:source']
    inputs:
      type: object
      additionalProperties: false
      required: [file_ref, path]
      properties:
        file_ref: {type: string}
        path: {type: string, minLength: 1, maxLength: 300}
        max_results: {type: integer, minimum: 1, maximum: 500, default: 50}
        max_value_chars: {type: integer, minimum: 100, maximum: 20000, default: 2000}
    outputs:
      type: object
      required: [file_ref, path, matches, results]
      properties:
        file_ref: {type: string}
        path: {type: string}
        matches: {type: integer}
        truncated: {type: boolean}
        results:
          type: array
          items:
            type: object
            properties:
              path: {type: string}
              type: {type: string}
              value: {}
              preview: {type: string}
              truncated: {type: boolean}
  - id: check_validate
    name: Validate Against Schema
    description: >
      The file checked against a JSON Schema, given inline as schema or as an attached file as schema_ref. Every failure
      comes back with the path in the document, the rule that failed and what was wrong. With each_record, the records of
      an array or a JSON Lines file are checked one by one and failures carry the record's index. The result is recorded.
    level: 1
    timeout_seconds: 120
    calls: ['record.read:source', 'record.create:validation']
    inputs:
      type: object
      additionalProperties: false
      required: [file_ref]
      properties:
        file_ref: {type: string}
        schema: {type: object, additionalProperties: true}
        schema_ref: {type: string}
        each_record: {type: boolean, default: false}
        max_errors: {type: integer, minimum: 1, maximum: 500, default: 50}
    outputs:
      type: object
      required: [validation_ref, file_ref, valid, checked, failures, errors]
      properties:
        validation_ref: {type: string}
        file_ref: {type: string}
        valid: {type: boolean}
        checked: {type: integer}
        failures: {type: integer}
        truncated: {type: boolean}
        errors:
          type: array
          items:
            type: object
            properties: {record: {type: integer}, path: {type: string}, rule: {type: string}, message: {type: string}}
  - id: compare_versions
    name: Compare Versions
    description: >
      What changed between two JSON files, path by path: values added, removed and changed, with the value before and after.
      Deterministic — nothing is judged, only compared. Arrays are compared by position.
    level: 0
    timeout_seconds: 90
    calls: ['record.read:source']
    inputs:
      type: object
      additionalProperties: false
      required: [file_ref_a, file_ref_b]
      properties:
        file_ref_a: {type: string}
        file_ref_b: {type: string}
        max_changes: {type: integer, minimum: 1, maximum: 500, default: 100}
    outputs:
      type: object
      required: [identical, added, removed, changed, changes]
      properties:
        identical: {type: boolean}
        added: {type: integer}
        removed: {type: integer}
        changed: {type: integer}
        truncated: {type: boolean}
        changes:
          type: array
          items:
            type: object
            properties:
              kind: {type: string, enum: [added, removed, changed]}
              path: {type: string}
              before: {type: string}
              after: {type: string}
  - id: shape_to_table
    name: JSON To CSV
    description: >
      A CSV file from the records of a JSON or JSON Lines file. record_path picks what a record is (a.b[*]); left out, the
      records are the items of a top-level array, the lines of a JSON Lines file, or the single object. Nested values become
      dotted columns (address.city); a list becomes its JSON text. columns picks and orders them; left out, every column
      found is kept in the order it first appears. The CSV is handed to the person as this call's file.
    level: 2
    timeout_seconds: 120
    calls: ['record.read:source', 'record.create:output']
    inputs:
      type: object
      additionalProperties: false
      required: [file_ref, filename]
      properties:
        file_ref: {type: string}
        filename: {type: string, minLength: 1, maxLength: 120}
        record_path: {type: string, maxLength: 300}
        columns: {type: array, maxItems: 100, items: {type: string, maxLength: 120}}
        max_rows: {type: integer, minimum: 1, maximum: 50000, default: 10000}
    outputs:
      type: object
      required: [file_ref, filename, output_ref, rows, columns]
      properties:
        file_ref: {type: string}
        filename: {type: string}
        output_ref: {type: string}
        rows: {type: integer}
        columns: {type: array, items: {type: string}}
        truncated: {type: boolean}
        skipped: {type: integer}
  - id: shape_to_json
    name: CSV To JSON
    description: >
      A JSON file from a CSV file: one object per row, keyed by the header. With infer_types, numbers become numbers, true
      and false become booleans and an empty cell becomes null — except that anything with a leading zero or more than fifteen
      digits stays text, because it is an identifier, not a number. With expand_dots, a column named address.city becomes
      a nested object, which is what shape_to_table flattened. The JSON is handed to the person as this call's file.
    level: 2
    timeout_seconds: 120
    calls: ['record.read:source', 'record.create:output']
    inputs:
      type: object
      additionalProperties: false
      required: [file_ref, filename]
      properties:
        file_ref: {type: string}
        filename: {type: string, minLength: 1, maxLength: 120}
        infer_types: {type: boolean, default: true}
        expand_dots: {type: boolean, default: true}
        max_rows: {type: integer, minimum: 1, maximum: 50000, default: 10000}
    outputs:
      type: object
      required: [file_ref, filename, output_ref, records, columns]
      properties:
        file_ref: {type: string}
        filename: {type: string}
        output_ref: {type: string}
        records: {type: integer}
        columns: {type: array, items: {type: string}}
        truncated: {type: boolean}
