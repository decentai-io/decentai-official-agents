schema: 3
agent:
  id: outlook
  name: Outlook
  version: "2.0.1"
  description: >-
    Your Microsoft 365 or Outlook.com mail, calendar and To Do, through the assistant. Read whole conversations and attachments,
    draft replies, forwards and new mail with files attached and send only on your go-ahead; see your calendar, find a time
    that suits everyone, and invite, move, cancel or answer meetings; keep your To Do lists; and be told when a reply arrives,
    new mail lands or a task is ticked off.
  instructions: >-
    Use this agent for a Microsoft 365 or Outlook.com account's mail, calendar and To Do. account_list names the connected
    accounts; every function takes an optional account (the address): pass it when the person names one or when several
    are connected. account_status says the account's addresses, whether it is work or personal, its time zone and today's
    date. MAIL. For "what came in" or unread mail start with mail_list; to find something, mail_find (Microsoft's search
    words: from:, subject:, received>=2026-09-01, hasattachments:true). Then read before answering: mail_thread for a conversation,
    mail_read for one message. Quote what the mail says; never invent a message, sender, date or id. If a result has "next"
    (thread) or next_offset (message), there is more: call again before saying what it says. Attachments are listed with
    each message; mail_save_attachment brings one into the chat for another agent to read. A reply (draft_reply; all true
    to reply to all), a forward (draft_forward) or a new message (draft_compose) is prepared as a DRAFT, chat files attached
    with files, and shown to the person; draft_send is a separate step that needs their explicit go-ahead. A send that comes
    back "unknown" was not confirmed: say so, never send again; they should look in Sent Items. mail_mark, mail_move, mail_archive
    and mail_folders keep mail in order. CALENDAR. Start with calendar_list (dates in the person's zone; it says today's
    date). To find a time, calendar_find_times: it proposes only slots free for everyone whose calendar could be checked
    and names the others in unchecked; never present those as free. Book a slot with calendar_invite and its proposal_ref,
    or calendar_create for an event with nobody invited. Attendees are email addresses: take them from mail or ask; never
    guess one. Inviting, changing, cancelling and answering (calendar_respond) are seen by others and need the person's
    go-ahead. When a date is ambiguous ("Thursday"), say which date you took. calendar_cancel on someone else's meeting
    declines it. TASKS. Start with tasks_list (the default To Do list unless list is named; tasks_lists names them). Add,
    change, complete and reopen freely; tasks_delete needs a go-ahead. Due dates are YYYY-MM-DD in the person's zone. WATCHES.
    Record a watch once, then schedule its check: watch_reply then watch_check (reminders while a reply is missing); watch_inbox
    then watch_new_mail (act on new mail as the person's standing instruction says); watch_tasks then watch_task_changes
    (what was ticked off in To Do). watches_list shows them, watches_close stops one. Never record a second watch for the
    same request. Some features need a work or school account (other people's free/busy, Teams links); on a personal account
    the agent says so. Ids and links are Outlook's own: pass them on unchanged.
  examples:
  - title: Read a conversation
    prompt: Find the latest email from Northlight about the chairs and read me the whole conversation.
  - title: Reply with a file
    prompt: >-
      Reply to all on the Q-2041 thread saying we accept the quotation, attach the signed PDF I just uploaded, and show
      me the draft before sending.
  - title: What is on
    prompt: What is on my calendar tomorrow, and am I free on Sunday afternoon?
  - title: Find a time
    prompt: >-
      Find three one-hour slots next week when Dana and I are both free, afternoons only, Sunday to Thursday.
  - title: To Do
    prompt: Add "Send the chair quotation to Dana" to my To Do list, due Thursday, high importance.
  - title: Watch the inbox
    prompt: >-
      Watch my inbox for mail from harbourline.example and, whenever something arrives, read it and draft a reply for me
      to see.
  tags:
  - email
  - calendar
  - tasks
  - outlook
  - microsoft
network:
  hosts:
  - graph.microsoft.com
  - outlook.office.com
  - outlook.office365.com
resources:
  secrets:
    - id: microsoft
      label: Microsoft Account
      description: >
        A Microsoft account, work, school or personal, connected by signing in. Every Microsoft agent in the catalog asks
        for the same permissions, so one saved account can be granted to each of them. The platform keeps and refreshes
        the tokens; this agent receives a short-lived access token and the address. An account connected before this
        version needs one reconnect to add the new permissions. api_base_url is for tests only; leave it empty.
      binding: {cardinality: many, required: true}
      oauth:
        provider: microsoft
        authorize_url: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
        token_url: https://login.microsoftonline.com/common/oauth2/v2.0/token
        scopes:
          - openid
          - email
          - offline_access
          - User.Read
          - Mail.ReadWrite
          - Mail.Send
          - MailboxSettings.Read
          - Calendars.ReadWrite
          - Files.ReadWrite.All
          - Chat.ReadWrite
          - Team.ReadBasic.All
          - Channel.ReadBasic.All
          - ChannelMessage.Send
          - Tasks.ReadWrite
        identity: {url: 'https://graph.microsoft.com/v1.0/me', field: userPrincipalName}
      fields:
        - name: api_base_url
          label: API Base URL (tests only)
          type: string
          storage: keys
          required: false
  data:
  - id: draft
    label: Email Draft
    description: A message prepared in Outlook (new, reply, reply to all or forward), and what became of it.
    binding:
      cardinality: many
      required: false
    fields:
    - name: outlook_draft_id
      label: Outlook Draft ID
      type: string
      storage: keys
      required: true
    - name: kind
      label: Kind
      type: select
      storage: keys
      required: true
      options:
      - new
      - reply
      - reply_all
      - forward
    - name: thread_id
      label: Thread ID
      type: string
      storage: keys
      required: false
    - name: status
      label: Status
      type: select
      storage: keys
      required: true
      options:
      - prepared
      - sent
      - unknown
      - discarded
    - name: account
      label: Account
      type: string
      storage: keys
      required: false
    - name: sent_message_id
      label: Sent Message ID
      type: string
      storage: keys
      required: false
    - name: content
      label: Recipients, Subject, Text And Files
      type: object
      storage: values
      required: false
  - id: proposal
    label: Proposed Time
    description: A free slot calendar_find_times offered, and whether it was booked.
    binding:
      cardinality: many
      required: false
    fields:
    - name: start
      label: Start
      type: string
      storage: keys
      required: true
    - name: end
      label: End
      type: string
      storage: keys
      required: true
    - name: timezone
      label: Time Zone
      type: string
      storage: keys
      required: false
    - name: status
      label: Status
      type: select
      storage: keys
      required: true
      options:
      - offered
      - booked
    - name: account
      label: Account
      type: string
      storage: keys
      required: false
    - name: event_id
      label: Event ID
      type: string
      storage: keys
      required: false
    - name: attendees
      label: Attendees
      type: object
      storage: values
      required: false
  - id: watch
    label: Reply Watch
    description: A conversation the person is waiting on, and when it last moved.
    binding:
      cardinality: many
      required: false
    fields:
    - name: thread_id
      label: Thread ID
      type: string
      storage: keys
      required: true
    - name: since
      label: Last Message At (UTC)
      type: string
      storage: keys
      required: true
    - name: anchor_id
      label: Last Message ID
      type: string
      storage: keys
      required: false
    - &id001
      name: status
      label: Status
      type: select
      storage: keys
      required: true
      options:
      - active
      - closed
    - name: account
      label: Account
      type: string
      storage: keys
      required: false
    - name: subject
      label: Subject
      type: string
      storage: values
      required: false
    - name: note
      label: Note
      type: string
      storage: values
      required: false
  - id: inbox
    label: Inbox Watch
    description: >-
      How far a mail folder has been read for the person: the time of the newest message handed on (Graph's clock, UTC),
      the ids on that second, and which senders count.
    binding:
      cardinality: many
      required: false
    fields:
    - name: since
      label: Read Up To (UTC)
      type: string
      storage: keys
      required: true
    - name: cursor_ids
      label: Ids At That Second
      type: string
      storage: keys
      required: false
    - *id001
    - name: account
      label: Account
      type: string
      storage: keys
      required: false
    - name: folder
      label: Folder ID
      type: string
      storage: keys
      required: false
    - name: folder_name
      label: Folder
      type: string
      storage: keys
      required: false
    - name: only_from
      label: Only From
      type: string
      storage: keys
      required: false
    - name: skip_from
      label: Skip From
      type: string
      storage: keys
      required: false
    - name: note
      label: Note
      type: string
      storage: values
      required: false
  - id: taskwatch
    label: To Do Watch
    description: Where each watched To Do list's change feed was left, and which completions were handed on.
    binding:
      cardinality: many
      required: false
    fields:
    - name: list_id
      label: List ID
      type: string
      storage: keys
      required: false
    - *id001
    - name: account
      label: Account
      type: string
      storage: keys
      required: false
    - name: report
      label: Report
      type: select
      storage: keys
      required: true
      options:
      - completed
      - all
    - name: started
      label: Started (UTC)
      type: string
      storage: keys
      required: false
    - name: checked_at
      label: Last Checked (UTC)
      type: string
      storage: keys
      required: false
    - name: list_name
      label: List
      type: string
      storage: values
      required: false
    - name: links
      label: Change Feed Places
      type: object
      storage: values
      required: false
    - name: seen
      label: Completions Handed On
      type: object
      storage: values
      required: false
    - name: note
      label: Note
      type: string
      storage: values
      required: false
functions:
- id: account_list
  name: Connected Accounts
  description: >-
    Which Microsoft accounts are connected to this agent, by address. With more than one, pass the one meant as account
    on every other function.
  level: 0
  timeout_seconds: 30
  calls:
  - record.list:microsoft
  inputs:
    type: object
    additionalProperties: false
    properties: {}
  outputs:
    type: object
    required:
    - accounts
    properties:
      accounts: &id002
        type: array
- id: account_status
  name: Account Status
  description: >-
    Whether the connection works, the account's addresses, whether it is a work or school account or a personal one, its
    time zone and today's date there. Asks nobody to connect one.
  level: 0
  timeout_seconds: 30
  calls:
  - record.list:microsoft
  - record.read:microsoft
  inputs:
    type: object
    additionalProperties: false
    properties:
      account: &id004
        type: string
        maxLength: 200
        description: The account's address, when several are connected.
      timezone: &id005
        type: string
        maxLength: 64
        description: 'IANA zone (Asia/Dubai). Left out: the mailbox''s own zone.'
  outputs:
    type: object
    required:
    - connected
    - email
    properties:
      connected: &id006
        type: boolean
      email: &id003
        type: string
      addresses: *id002
      kind: *id003
      today: *id003
      timezone: *id003
      timezone_note: *id003
      problem: *id003
- id: mail_find
  name: Find Mail
  description: >-
    Search the mailbox (or one folder) with Microsoft's search words: plain words, from:, to:, subject:, received>=2026-09-01,
    hasattachments:true, joined with AND/OR. One row per message with its thread_id, newest first as Microsoft sorts a search.
    page_token continues.
  level: 0
  timeout_seconds: 180
  calls:
  - record.list:microsoft
  - record.read:microsoft
  - record.create:microsoft
  inputs:
    type: object
    additionalProperties: false
    required:
    - query
    properties:
      account: *id004
      query:
        type: string
        maxLength: 500
        minLength: 1
      folder:
        type: string
        maxLength: 200
      max_results:
        type: integer
        minimum: 1
        maximum: 25
        default: 10
      page_token:
        type: string
        maxLength: 4000
      timezone: *id005
  outputs:
    type: object
    required:
    - messages
    - more
    properties:
      messages: &id007
        type: array
        items:
          type: object
      more: *id006
      next_page_token: *id003
      timezone: *id003
- id: mail_list
  name: List Mail
  description: >-
    A folder's newest mail first (the inbox unless folder names another): optionally only unread, only from one address,
    or only since a date or time in the person's zone. Use it for "what came in today" and "my unread mail"; mail_find is
    for searching.
  level: 0
  timeout_seconds: 60
  calls:
  - record.list:microsoft
  - record.read:microsoft
  - record.create:microsoft
  inputs:
    type: object
    additionalProperties: false
    properties:
      account: *id004
      folder:
        type: string
        maxLength: 200
      unread_only: &id009
        type: boolean
      from:
        type: string
        maxLength: 200
      since:
        type: string
        maxLength: 40
      max_results:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
      page_token:
        type: string
        maxLength: 4000
      timezone: *id005
  outputs:
    type: object
    required:
    - folder
    - messages
    - more
    properties:
      folder: *id003
      messages: *id007
      more: *id006
      next_page_token: *id003
- id: mail_read
  name: Read Message
  description: >-
    One message whole: sender, recipients, date, its full body as text (from the HTML when that is all it has), and its
    attachments (files, attached messages, cloud links; inline pictures left out). A long body comes in parts: next_offset
    says where the next part starts; pass it as offset.
  level: 0
  timeout_seconds: 60
  calls:
  - record.list:microsoft
  - record.read:microsoft
  - record.create:microsoft
  inputs:
    type: object
    additionalProperties: false
    required:
    - message_id
    properties:
      account: *id004
      message_id:
        type: string
        maxLength: 400
        minLength: 1
      offset:
        type: integer
        minimum: 0
        maximum: 10000000
        default: 0
      max_chars:
        type: integer
        minimum: 1000
        maximum: 50000
        default: 20000
      timezone: *id005
  outputs:
    type: object
    required:
    - message_id
    - body
    - body_chars
    - attachments
    properties:
      message_id: *id003
      body: *id003
      body_chars: &id008
        type: integer
      next_offset: *id008
      attachments: *id002
- id: mail_thread
  name: Read Conversation
  description: >-
    A whole conversation, oldest first: every message with its own words (the history it quotes is the messages before it;
    quoted true gives each body whole), and the attachments of every message shown. Nothing is cut silently: when max_chars
    runs out, "next" names start and offset for the next call, and complete is false.
  level: 0
  timeout_seconds: 60
  calls:
  - record.list:microsoft
  - record.read:microsoft
  - record.create:microsoft
  inputs:
    type: object
    additionalProperties: false
    properties:
      account: *id004
      thread_id:
        type: string
        maxLength: 400
      message_id:
        type: string
        maxLength: 400
      start:
        type: integer
        minimum: 0
        maximum: 1000
        default: 0
      offset:
        type: integer
        minimum: 0
        maximum: 10000000
        default: 0
      max_chars:
        type: integer
        minimum: 2000
        maximum: 60000
        default: 30000
      quoted: *id009
      timezone: *id005
  outputs:
    type: object
    required:
    - thread_id
    - subject
    - message_count
    - messages
    - attachments
    - complete
    properties:
      thread_id: *id003
      subject: *id003
      message_count: *id008
      messages: *id007
      attachments: *id002
      complete: *id006
      next:
        type: object
- id: mail_save_attachment
  name: Save Attachment
  description: >-
    Bring one attachment into the chat as a file another agent can read: a file as it is, an attached message as a .eml
    file; at most 8 MiB less 64 KiB. A cloud link is not a file: open it from the message.
  level: 0
  timeout_seconds: 120
  calls:
  - record.list:microsoft
  - record.read:microsoft
  - record.create:microsoft
  inputs:
    type: object
    additionalProperties: false
    required:
    - message_id
    - attachment_id
    properties:
      account: *id004
      message_id:
        type: string
        maxLength: 400
        minLength: 1
      attachment_id:
        type: string
        maxLength: 2000
        minLength: 1
  outputs:
    type: object
    required:
    - file_ref
    - filename
    - size
    properties:
      file_ref: *id003
      filename: *id003
      size: *id008
      kind: *id003
- id: mail_folders
  name: Mail Folders
  description: The mailbox's folders, child folders under their parents (path), with unread and total counts.
  level: 0
  timeout_seconds: 60
  calls:
  - record.list:microsoft
  - record.read:microsoft
  - record.create:microsoft
  inputs:
    type: object
    additionalProperties: false
    properties:
      account: *id004
  outputs:
    type: object
    required:
    - folders
    properties:
      folders: *id002
- id: mail_mark
  name: Mark Mail
  description: Mark messages read or unread, or flag them (flagged, complete, none).
  level: 2
  timeout_seconds: 60
  calls:
  - record.list:microsoft
  - record.read:microsoft
  - record.create:microsoft
  inputs:
    type: object
    additionalProperties: false
    required:
    - message_ids
    properties:
      account: *id004
      message_ids: &id010
        type: array
        minItems: 1
        maxItems: 25
        items:
          type: string
          maxLength: 400
      read: *id009
      flag:
        type: string
        enum:
        - flagged
        - complete
        - none
  outputs:
    type: object
    required:
    - marked
    - failed
    properties:
      marked: *id002
      failed: *id002
- id: mail_move
  name: Move Mail
  description: >-
    Move messages to a folder, by its name, path (Clients/Harbourline) or a well-known name: inbox, archive, deleted, junk.
  level: 2
  timeout_seconds: 60
  calls:
  - record.list:microsoft
  - record.read:microsoft
  - record.create:microsoft
  inputs:
    type: object
    additionalProperties: false
    required:
    - message_ids
    - folder
    properties:
      account: *id004
      message_ids: *id010
      folder:
        type: string
        maxLength: 300
        minLength: 1
  outputs:
    type: object
    required:
    - moved
    - failed
    - folder
    properties:
      moved: *id002
      failed: *id002
      folder: *id003
- id: mail_archive
  name: Archive Mail
  description: Move messages to the Archive folder.
  level: 2
  timeout_seconds: 60
  calls:
  - record.list:microsoft
  - record.read:microsoft
  - record.create:microsoft
  inputs:
    type: object
    additionalProperties: false
    required:
    - message_ids
    properties:
      account: *id004
      message_ids: *id010
  outputs:
    type: object
    required:
    - moved
    - failed
    - folder
    properties:
      moved: *id002
      failed: *id002
      folder: *id003
- id: draft_compose
  name: Draft New Message
  description: Prepare a new message as an Outlook draft, with chat files attached if given. Nothing is sent.
  level: 2
  timeout_seconds: 180
  calls:
  - record.list:microsoft
  - record.read:microsoft
  - record.create:microsoft
  - record.create:draft
  inputs:
    type: object
    additionalProperties: false
    required:
    - to
    - subject
    - body
    properties:
      account: *id004
      to:
        type: string
        maxLength: 2000
        minLength: 3
      cc:
        type: string
        maxLength: 2000
      bcc:
        type: string
        maxLength: 2000
      subject:
        type: string
        maxLength: 300
        minLength: 1
      body:
        type: string
        maxLength: 100000
        minLength: 1
      format:
        type: string
        enum:
        - text
        - html
        default: text
      files: &id011
        type: array
        maxItems: 10
        items: &id012
          type: string
        description: Chat files to attach (their refs), each at most 8 MiB less 64 KiB.
  outputs:
    type: object
    required:
    - draft_ref
    - outlook_draft_id
    - to
    - subject
    - attached
    properties:
      draft_ref: *id003
      outlook_draft_id: *id003
      to: *id003
      subject: *id003
      attached: *id002
      link: *id003
- id: draft_reply
  name: Draft Reply
  description: >-
    Prepare a reply (all true: reply to all) as an Outlook draft: the person's words above the quoted history, the conversation
    kept. Answers message_id, or the latest message of thread_id; when that one is the account's own, the reply goes to
    whom it was sent. to and cc change the recipients. Nothing is sent.
  level: 2
  timeout_seconds: 180
  calls:
  - record.list:microsoft
  - record.read:microsoft
  - record.create:microsoft
  - record.create:draft
  inputs:
    type: object
    additionalProperties: false
    required:
    - body
    properties:
      account: *id004
      message_id:
        type: string
        maxLength: 400
      thread_id:
        type: string
        maxLength: 400
      body:
        type: string
        maxLength: 100000
        minLength: 1
      all: *id009
      to:
        type: string
        maxLength: 2000
      cc:
        type: string
        maxLength: 2000
      files: *id011
  outputs:
    type: object
    required:
    - draft_ref
    - outlook_draft_id
    - to
    - subject
    - attached
    properties:
      draft_ref: *id003
      outlook_draft_id: *id003
      to: *id003
      cc: *id003
      subject: *id003
      attached: *id002
      link: *id003
- id: draft_forward
  name: Draft Forward
  description: >-
    Prepare a forward of message_id (or the latest message of thread_id) to new recipients, its attachments kept, with the
    person's words above it. Nothing is sent.
  level: 2
  timeout_seconds: 180
  calls:
  - record.list:microsoft
  - record.read:microsoft
  - record.create:microsoft
  - record.create:draft
  inputs:
    type: object
    additionalProperties: false
    required:
    - to
    properties:
      account: *id004
      message_id:
        type: string
        maxLength: 400
      thread_id:
        type: string
        maxLength: 400
      to:
        type: string
        maxLength: 2000
        minLength: 3
      body:
        type: string
        maxLength: 100000
      files: *id011
  outputs:
    type: object
    required:
    - draft_ref
    - outlook_draft_id
    - to
    - subject
    - attached
    properties:
      draft_ref: *id003
      outlook_draft_id: *id003
      to: *id003
      subject: *id003
      attached: *id002
      link: *id003
- id: draft_attach
  name: Attach Files To Draft
  description: >-
    Attach chat files to a prepared draft: under 3 MB in one request, larger ones (at most 8 MiB less 64 KiB) uploaded in
    pieces.
  level: 2
  timeout_seconds: 180
  calls:
  - record.list:microsoft
  - record.read:microsoft
  - record.create:microsoft
  - record.read:draft
  - record.update:draft
  inputs:
    type: object
    additionalProperties: false
    required:
    - draft_ref
    - files
    properties:
      draft_ref:
        type: string
        maxLength: 200
        minLength: 1
      files:
        type: array
        maxItems: 10
        items: *id012
        description: Chat files to attach (their refs), each at most 8 MiB less 64 KiB.
        minItems: 1
  outputs:
    type: object
    required:
    - draft_ref
    - attached
    properties:
      draft_ref: *id003
      attached: *id002
- id: draft_send
  name: Send Draft
  description: >-
