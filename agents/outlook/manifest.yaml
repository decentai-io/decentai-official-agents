  name: To Do Changes
  description: >-
    What changed in the watched To Do lists since the last check: each row a task with its change (completed, and with report
    all: added, changed, reopened, removed). A task already reported completed is not reported again when it is edited.
    Safe to schedule: it runs unattended.
  level: 1
  timeout_seconds: 90
  schedulable: true
  calls:
  - record.list:microsoft
  - record.read:microsoft
  - record.list:taskwatch
  - record.read:taskwatch
  - record.update:taskwatch
  inputs:
    type: object
    additionalProperties: false
    properties:
      watch_ref:
        type: string
        maxLength: 200
  outputs:
    type: object
    required:
    - checked
    - changes
    - problems
    - closed
    - more
    properties:
      changes: *id002
      checked: *id008
      problems: *id002
      closed: *id002
      more: *id006
- id: watches_list
  name: Watches
  description: >-
    Every watch this agent keeps (replies, inbox, To Do), with what each looks at; include_closed adds those stopped.
  level: 0
  timeout_seconds: 30
  calls:
  - record.list:watch
  - record.read:watch
  - record.list:inbox
  - record.read:inbox
  - record.list:taskwatch
  - record.read:taskwatch
  inputs:
    type: object
    additionalProperties: false
    properties:
      include_closed: *id009
  outputs:
    type: object
    required:
    - watches
    properties:
      watches: *id002
- id: watches_close
  name: Stop Watch
  description: 'Stop a watch for good, by its watch_ref: its schedule hears nothing more from it.'
  level: 1
  timeout_seconds: 30
  calls:
  - record.read:watch
  - record.update:watch
  - record.read:inbox
  - record.update:inbox
  - record.read:taskwatch
  - record.update:taskwatch
  inputs:
    type: object
    additionalProperties: false
    required:
    - watch_ref
    properties:
      watch_ref:
        type: string
        maxLength: 200
        minLength: 1
  outputs:
    type: object
    required:
    - watch_ref
    - closed
    properties:
      watch_ref: *id003
      closed: *id006
      already: *id006
      kind: *id003
