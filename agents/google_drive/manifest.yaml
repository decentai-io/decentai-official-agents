schema: 3
agent:
  id: google_drive
  name: Google Drive
  version: "2.0.1"
  description: >
    Your Google Drive, shared drives included, and the Docs, Sheets and Forms in it: find and bring in files, file and
    share them on your go-ahead, read and edit documents, work in live spreadsheets, count form responses, and be told
    what changed.
  instructions: >
    One agent for a person's Google Drive and the Docs, Sheets and Forms in it, across My Drive, shared drives and what
    was shared with them. Start with files_search (kind narrows it to document, spreadsheet, form, folder or pdf), files_list
    for a folder, or files_shared_with_me; every id comes from one of these, never invent one. files_drives lists shared
    drives. Several accounts may be connected: pass account (the address) when more than one is, and keep using it.
    Docs: docs_read gives numbered paragraphs across every tab, with headers, footers and footnotes; those numbers are what
    edits_propose and docs_insert take. Change a paragraph with edits_propose, show the old and new text, and only on a yes
    call edits_apply; it is refused if the document changed since. Sheets: sheets_get shows the tabs, sheets_read reads a
    window (from_row, max_rows) with the header row you name; continue with next_row, never re-reading the header.
    Writes store what is given as is: pass numbers as numbers, and set formulas only when the person asks for a formula.
    For sums, counts, averages or "is X in the sheet" use sheets_totals and sheets_find; never add up rows yourself. Forms:
    forms_get for the questions, responses_list to read, responses_tally to count answers; never count them yourself.
    files_download brings a copy into the chat (Google files as docx, xlsx, pptx, pdf, txt, or a tab as csv); files over
    the chat's limit are refused with a link. Uploads, folders, moves, copies, trash and restore change the person's drive;
    comments, invites and links are seen by others: ask before each. sharing_link shares within the organization unless
    the person asks for anyone with the link; a personal account has no organization, so ask. People are email addresses:
    ask for one rather than guess. Watches (changes_watch, comments_watch, rows_watch, responses_watch) are checked by the
    matching *_new function on a schedule; watches_list and watches_close manage them.
  examples:
    - {title: Find and bring in, prompt: 'Find the Riverside lease in our shared drive and bring me a PDF copy.'}
    - {title: Edit a doc, prompt: 'In the Q3 proposal doc, change the delivery paragraph to say 10 working days.'}
    - {title: Add a row, prompt: 'Add an order to the Orders sheet: Sidra Office Supplies, 12 chairs, 1840.00.'}
    - {title: Count answers, prompt: 'How did people answer the customer feedback form this month?'}
    - {title: New sign-ups, prompt: 'Tell me every morning about new rows in the Workshop sign-ups sheet.'}
    - {title: Share, prompt: 'Put the file I attached in Contracts and share it with dana@sidra.example, view only.'}
  tags: [files, storage, google, documents, spreadsheets, forms, productivity]
network:
  hosts: [www.googleapis.com, docs.googleapis.com, sheets.googleapis.com, forms.googleapis.com, '*.googleusercontent.com']
resources:
  secrets:
    - id: google
      label: Google Account
      description: >
        A Google account, connected by signing in. Every Google agent in the catalog asks for the same permissions, so one
        saved account can be granted to each of them. The platform keeps and refreshes the tokens; this agent receives a
        short-lived access token and the address. An account connected before this version needs one reconnect to add the
        new permissions. api_base_url is for tests only; leave it empty.
      binding: {cardinality: many, required: true}
      oauth:
        provider: google
        authorize_url: https://accounts.google.com/o/oauth2/v2/auth
        token_url: https://oauth2.googleapis.com/token
        scopes:
          - openid
          - https://www.googleapis.com/auth/userinfo.email
          - https://www.googleapis.com/auth/gmail.modify
          - https://www.googleapis.com/auth/calendar
          - https://www.googleapis.com/auth/drive
          - https://www.googleapis.com/auth/spreadsheets
          - https://www.googleapis.com/auth/documents
          - https://www.googleapis.com/auth/forms.body.readonly
          - https://www.googleapis.com/auth/forms.responses.readonly
          - https://www.googleapis.com/auth/tasks
        authorize_params: {access_type: offline, prompt: consent}
        identity: {url: 'https://openidconnect.googleapis.com/v1/userinfo', field: email}
      fields:
        - name: api_base_url
          label: API Base URL (tests only)
          type: string
          storage: keys
          required: false
  data:
    - id: share
      label: Share
      description: Every share this agent granted or revoked, and for whom.
      binding: {cardinality: many, required: false}
      fields:
        - {name: item_id, label: Item ID, type: string, storage: keys, required: true}
        - {name: kind, label: Kind, type: select, storage: keys, required: true, options: [invite, link]}
        - {name: role, label: Role, type: select, storage: keys, required: true, options: [read, comment, write]}
        - {name: status, label: Status, type: select, storage: keys, required: true, options: [granted, revoked]}
        - {name: permission_id, label: Permission ID, type: string, storage: keys, required: false}
        - {name: account, label: Account, type: string, storage: keys, required: false}
        - {name: name, label: File, type: string, storage: values, required: false}
        - {name: who, label: Who, type: string, storage: values, required: false}
        - {name: link, label: Link, type: string, storage: values, required: false}
    - id: edit
      label: Document edit
      description: A change to one paragraph of a Google Doc, proposed, then applied, refused or discarded.
      binding: {cardinality: many, required: false}
      fields:
        - {name: document_id, label: Document ID, type: string, storage: keys, required: true}
        - {name: paragraph, label: Paragraph, type: number, storage: keys, required: true}
        - {name: tab_id, label: Tab ID, type: string, storage: keys, required: false}
        - {name: segment_id, label: Segment ID, type: string, storage: keys, required: false}
        - {name: revision_id, label: Revision proposed against, type: string, storage: keys, required: true}
        - {name: applied_revision_id, label: Revision after applying, type: string, storage: keys, required: false}
        - name: status
          label: Status
          type: select
          storage: keys
          required: true
          options: [proposed, applied, refused, discarded, unknown]
        - {name: account, label: Account, type: string, storage: keys, required: false}
        - {name: title, label: Document, type: string, storage: values, required: false}
        - {name: old_text, label: Text as read, type: string, storage: values, required: false}
        - {name: new_text, label: New text, type: string, storage: values, required: false}
        - {name: note, label: Note, type: string, storage: values, required: false}
        - {name: reason, label: Why refused, type: string, storage: values, required: false}
    - id: write
      label: Sheet write
      description: Every append and overwrite in a spreadsheet; for an overwrite, what the cells held before.
      binding: {cardinality: many, required: false}
      fields:
        - {name: spreadsheet_id, label: Spreadsheet ID, type: string, storage: keys, required: true}
        - {name: tab, label: Tab, type: string, storage: keys, required: true}
        - {name: kind, label: Kind, type: select, storage: keys, required: true, options: [append, update]}
        - {name: range, label: Range, type: string, storage: keys, required: false}
        - {name: rows, label: Rows, type: number, storage: keys, required: false}
        - {name: account, label: Account, type: string, storage: keys, required: false}
        - {name: spreadsheet, label: Spreadsheet, type: string, storage: values, required: false}
        - {name: written, label: Written, type: object, storage: values, required: false}
        - {name: previous, label: Before, type: object, storage: values, required: false}
    - id: watch
      label: Watch
      description: >
        Something the person asked to hear about: a drive's changes, a file's comments, a tab's new rows, a form's new
        responses; and how far it has been read.
      binding: {cardinality: many, required: false}
      fields:
        - {name: kind, label: Kind, type: select, storage: keys, required: true, options: [changes, comments, rows, responses]}
        - {name: status, label: Status, type: select, storage: keys, required: true, options: [active, closed]}
        - {name: account, label: Account, type: string, storage: keys, required: false}
        - {name: target_id, label: Watched, type: string, storage: keys, required: false}
        - {name: label, label: Label, type: string, storage: keys, required: false}
        - {name: folder_id, label: Folder ID, type: string, storage: keys, required: false}
        - {name: sheet_id, label: Tab ID, type: number, storage: keys, required: false}
        - {name: header_row, label: Header row, type: number, storage: keys, required: false}
        - {name: include_mine, label: Include own changes, type: select, storage: keys, required: false, options: ['yes', 'no']}
        - {name: cursor, label: Cursor, type: string, storage: keys, required: false}
        - {name: cursor_ids, label: Ids at the cursor, type: string, storage: keys, required: false}
        - {name: fingerprint, label: Last rows seen, type: string, storage: keys, required: false}
        - {name: note, label: Note, type: string, storage: values, required: false}
functions:
  # -- the account ----------------------------------------------------------------------------------------------------
  - id: account_status
    name: Google Account Status
    description: >
      Which Google accounts are connected, and for the one named (or the only one): its address, whether it belongs to an
      organization (its hosted domain) or is personal, and how full its drive is.
    level: 0
    timeout_seconds: 30
    calls: ['record.list:google', 'record.read:google']
    inputs: {type: object, additionalProperties: false, properties: {account: &account {type: string, maxLength: 320, description: "The connected account's address, when several are connected."}}}
    outputs:
      type: object
      required: [connected]
      properties:
        connected: {type: boolean}
        account: {type: string}
        accounts: {type: array, items: {type: string}}
        personal: {type: boolean}
        organization: {type: string}
        used_bytes: {type: integer}
        total_bytes: {type: integer}
        problem: {type: string}
        kind: {type: string}
  - id: account_connect
    name: Connect a Google Account
    description: Connect a Google account (another one, or the first); the person signs in on the platform's own form.
    level: 1
    timeout_seconds: 600
    calls: ['record.list:google', 'record.read:google', 'record.create:google']
    inputs: {type: object, additionalProperties: false, properties: {}}
    outputs: {type: object, required: [connected], properties: {connected: {type: boolean}, account: {type: string}, accounts: {type: array, items: {type: string}}}}
  # -- files ----------------------------------------------------------------------------------------------------------
  - id: files_search
    name: Search Drive
    description: >
      Files and folders across My Drive and every shared drive whose name or content matches query (or, with no query,
      the most recently changed), optionally one kind only. Use page_token to continue.
    level: 0
    timeout_seconds: 60
    calls: &read ['record.list:google', 'record.read:google']
    inputs:
      type: object
      additionalProperties: false
      properties:
        account: *account
        query: {type: string, maxLength: 200}
        kind: {type: string, enum: [folder, document, spreadsheet, presentation, form, pdf]}
        modified_after: {type: string, maxLength: 40, description: 'RFC 3339, such as 2026-11-01T00:00:00Z'}
        max_results: {type: integer, minimum: 1, maximum: 100, default: 20}
        page_token: {type: string, maxLength: 4000}
    outputs: &items {type: object, required: [items], properties: {items: {type: array, items: {type: object}}, next_page_token: {type: string}, incomplete: {type: boolean}, folder: {type: object}}}
  - id: files_list
    name: List Folder
    description: >
      What is in a folder, folders first, by folder_id (any drive, a shared drive's id too) or folder_path from the top of
      My Drive ("/Contracts/2026"); the top of My Drive by default. Use page_token to continue.
    level: 0
    timeout_seconds: 60
    calls: *read
    inputs:
      type: object
      additionalProperties: false
      properties:
        account: *account
        folder_id: {type: string, maxLength: 200}
        folder_path: {type: string, maxLength: 400}
        max_results: {type: integer, minimum: 1, maximum: 200, default: 50}
        page_token: {type: string, maxLength: 4000}
    outputs: *items
  - id: files_shared_with_me
    name: Shared With Me
    description: Files other people shared with the account, newest share first, with who shared each. Use page_token to continue.
    level: 0
    timeout_seconds: 60
    calls: *read
    inputs:
      type: object
      additionalProperties: false
      properties:
        account: *account
        max_results: {type: integer, minimum: 1, maximum: 100, default: 25}
        page_token: {type: string, maxLength: 4000}
    outputs: *items
  - id: files_drives
    name: Shared Drives
    description: The shared drives the account is a member of, with their ids (usable as folder_id).
    level: 0
    timeout_seconds: 30
    calls: *read
    inputs:
      type: object
      additionalProperties: false
      properties:
        account: *account
        max_results: {type: integer, minimum: 1, maximum: 100, default: 50}
        page_token: {type: string, maxLength: 4000}
    outputs: {type: object, required: [drives], properties: {drives: {type: array, items: {type: object}}, next_page_token: {type: string}}}
  - id: files_get
    name: Get File
    description: One file or folder's details, by item_id.
    level: 0
    timeout_seconds: 30
    calls: *read
    inputs: &one_item {type: object, additionalProperties: false, required: [item_id], properties: {account: *account, item_id: {type: string, minLength: 1, maxLength: 200}}}
    outputs: {type: object, required: [item], properties: {item: {type: object}}}
  - id: files_versions
    name: File Versions
    description: A file's earlier versions (Drive revisions), newest first, with when and by whom.
    level: 0
    timeout_seconds: 60
    calls: *read
    inputs:
      type: object
      additionalProperties: false
      required: [item_id]
      properties:
        account: *account
        item_id: {type: string, minLength: 1, maxLength: 200}
        max_results: {type: integer, minimum: 1, maximum: 200, default: 20}
    outputs: {type: object, required: [versions], properties: {name: {type: string}, total: {type: integer}, versions: {type: array, items: {type: object}}}}
  - id: files_download
    name: Bring a File Into the Chat
    description: >
      A copy of a file as one of the chat's files, for the person or another agent to read. A Google Doc comes in as
      docx (or pdf, txt), a Sheet as xlsx (or pdf, or one tab as csv with tab), Slides as pptx (or pdf, txt); other files as
      they are. A file larger than a chat file may be is refused before download, with its link.
    level: 0
    timeout_seconds: 180
    calls: *read
    inputs:
      type: object
      additionalProperties: false
      required: [item_id]
      properties:
        account: *account
        item_id: {type: string, minLength: 1, maxLength: 200}
        format: {type: string, enum: [pdf, docx, xlsx, pptx, txt, csv]}
        tab: {type: string, maxLength: 200}
    outputs:
      type: object
      required: [file_ref, filename, size]
      properties: {file_ref: {type: string}, filename: {type: string}, size: {type: integer}, tab: {type: string}, rows: {type: integer}}
  - id: files_upload
    name: Upload a File
    description: >
      Put a file of the chat's (attached, or made by another agent) into a Drive folder, under its own name or name. A
      name already in the folder gets a number ("notice 1.pdf") unless on_conflict is replace (a new version of that file)
      or fail. convert makes a Word, Excel, PowerPoint or CSV file a Google file. On the person's go-ahead.
    level: 2
    timeout_seconds: 400
    calls: &write ['record.list:google', 'record.read:google', 'record.create:google']
    inputs:
      type: object
      additionalProperties: false
      required: [file_ref]
      properties:
        account: *account
        file_ref: {type: string}
        folder_id: {type: string, maxLength: 200}
        folder_path: {type: string, maxLength: 400}
        name: {type: string, maxLength: 300}
        on_conflict: {type: string, enum: [rename, replace, fail], default: rename}
        convert: {type: boolean, default: false}
    outputs: {type: object, required: [item], properties: {item: {type: object}, replaced: {type: boolean}}}
  - id: files_create_folder
    name: Create a Folder
    description: A new folder under folder_id or folder_path (the top of My Drive by default). On the person's go-ahead.
    level: 2
    timeout_seconds: 60
    calls: *write
    inputs:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        account: *account
        name: {type: string, minLength: 1, maxLength: 300}
        folder_id: {type: string, maxLength: 200}
        folder_path: {type: string, maxLength: 400}
    outputs: {type: object, required: [item], properties: {item: {type: object}}}
  - id: files_move
    name: Move or Rename
    description: Rename an item (new_name), move it to another folder (to_folder_id or to_folder_path), or both. On the person's go-ahead.
    level: 2
    timeout_seconds: 60
    calls: *write
    inputs: &move
      type: object
      additionalProperties: false
      required: [item_id]
      properties:
        account: *account
        item_id: {type: string, minLength: 1, maxLength: 200}
        new_name: {type: string, maxLength: 300}
        to_folder_id: {type: string, maxLength: 200}
        to_folder_path: {type: string, maxLength: 400}
    outputs: {type: object, required: [item], properties: {item: {type: object}}}
  - id: files_copy
    name: Copy a File
    description: A copy of a file, in the same folder or another, named new_name or "Copy of …". On the person's go-ahead.
    level: 2
    timeout_seconds: 90
    calls: *write
    inputs: *move
    outputs: {type: object, required: [item], properties: {item: {type: object}}}
  - id: files_trash
    name: Move to Trash
    description: An item to the Drive trash, from which files_restore brings it back (Drive empties it after 30 days). On the person's go-ahead.
    level: 2
    timeout_seconds: 45
    calls: *write
    inputs: *one_item
    outputs: &trashed {type: object, required: [item, trashed], properties: {item: {type: object}, trashed: {type: boolean}, note: {type: string}}}
  - id: files_restore
    name: Restore From Trash
    description: An item taken back out of the Drive trash. On the person's go-ahead.
    level: 2
    timeout_seconds: 45
    calls: *write
    inputs: *one_item
    outputs: *trashed
  # -- sharing --------------------------------------------------------------------------------------------------------
  - id: sharing_permissions
    name: Who Has Access
    description: 'Everyone who can open an item, with each permission''s id: the owner, people and groups invited, the organization or anyone with the link, and access inherited from a shared drive.'
    level: 0
    timeout_seconds: 45
    calls: *read
    inputs: *one_item
    outputs: {type: object, required: [permissions], properties: {name: {type: string}, link: {type: string}, permissions: {type: array, items: {type: object}}}}
  - id: sharing_invite
    name: Share With People
    description: Give people (email addresses) read, comment or write access to an item; Google emails them unless notify is false. On the person's go-ahead.
    level: 3
    timeout_seconds: 90
    calls: ['record.list:google', 'record.read:google', 'record.create:google', 'record.create:share']
    inputs:
      type: object
      additionalProperties: false
      required: [item_id, recipients]
      properties:
        account: *account
        item_id: {type: string, minLength: 1, maxLength: 200}
        recipients: {type: array, minItems: 1, maxItems: 20, items: {type: string, maxLength: 320}}
        role: {type: string, enum: [read, comment, write], default: read}
        message: {type: string, maxLength: 1000}
        notify: {type: boolean, default: true}
    outputs: {type: object, required: [share_ref, invited, role], properties: {share_ref: {type: string}, invited: {type: array, items: {type: string}}, role: {type: string}, link: {type: string}}}
  - id: sharing_link
    name: Share by Link
    description: >
      Open an item to everyone in the account's organization (the default) or, only when the person asks for it, anyone
      with the link; read, comment or write. A personal account has no organization and is told so. On the person's go-ahead.
    level: 3
    timeout_seconds: 60
    calls: ['record.list:google', 'record.read:google', 'record.create:google', 'record.create:share']
    inputs:
      type: object
      additionalProperties: false
      required: [item_id]
      properties:
        account: *account
        item_id: {type: string, minLength: 1, maxLength: 200}
        role: {type: string, enum: [read, comment, write], default: read}
        scope: {type: string, enum: [organization, anyone], default: organization}
    outputs: {type: object, required: [share_ref, link, reach], properties: {share_ref: {type: string}, link: {type: string}, reach: {type: string}, role: {type: string}}}
  - id: sharing_revoke
    name: Stop Sharing
    description: Remove one permission (from sharing_permissions) from an item. Not the owner's, nor access inherited from a shared drive. On the person's go-ahead.
    level: 3
    timeout_seconds: 60
    calls: ['record.list:google', 'record.read:google', 'record.create:google', 'record.create:share']
    inputs:
      type: object
      additionalProperties: false
      required: [item_id, permission_id]
      properties:
        account: *account
        item_id: {type: string, minLength: 1, maxLength: 200}
        permission_id: {type: string, minLength: 1, maxLength: 200}
    outputs: {type: object, required: [revoked], properties: {revoked: {type: boolean}, who: {type: string}, share_ref: {type: string}}}
  # -- changes --------------------------------------------------------------------------------------------------------
  - id: changes_watch
    name: Watch Drive Changes
    description: >
      Start hearing about files added, changed, trashed or removed, from now: across My Drive and every shared drive, or one
      shared drive (drive_id), optionally only the files directly in one folder. The account's own changes are left out
      unless include_mine.
    level: 1
    timeout_seconds: 60
    calls: &start ['record.list:google', 'record.read:google', 'record.create:google', 'record.create:watch']
    inputs:
      type: object
      additionalProperties: false
      properties:
        account: *account
        drive_id: {type: string, maxLength: 200}
        folder_id: {type: string, maxLength: 200}
        folder_path: {type: string, maxLength: 400}
        include_mine: {type: boolean, default: false}
        note: {type: string, maxLength: 500}
    outputs: &started {type: object, required: [watch_ref], properties: {watch_ref: {type: string}, label: {type: string}, since: {type: string}, cursor: {type: integer}, rows_so_far: {type: integer}, responses_so_far: {type: integer}}}
  - id: changes_new
    name: New Drive Changes
    description: What changed since the last check of each changes watch (or the one named), each file once as it is now. Schedulable.
    level: 1
    timeout_seconds: 180
    schedulable: true
    calls: &check ['record.list:google', 'record.read:google', 'record.list:watch', 'record.update:watch']
    inputs: &check_inputs
      type: object
      additionalProperties: false
      properties:
        watch_ref: {type: string, maxLength: 100}
        max_results: {type: integer, minimum: 1, maximum: 200, default: 50}
    outputs: &checked
      type: object
      required: [rows, checked, problems, closed, more]
      properties:
        rows: {type: array, items: {type: object}}
        checked: {type: integer}
        problems: {type: array, items: {type: object}}
        closed: {type: array, items: {type: object}}
        more: {type: boolean}
  # -- docs -----------------------------------------------------------------------------------------------------------
  - id: docs_read
    name: Read a Google Doc
    description: >
      A document as numbered paragraphs across every tab (tab narrows it), with headers, footers and footnotes, from
      paragraph from, at most max_paragraphs and max_chars; next_from continues. The numbers are what edits and inserts take.
    level: 0
    timeout_seconds: 60
    calls: *read
    inputs:
      type: object
      additionalProperties: false
      required: [document_id]
      properties:
        account: *account
        document_id: {type: string, minLength: 1, maxLength: 200}
        tab: {type: string, maxLength: 200}
        from: {type: integer, minimum: 1, default: 1}
        max_paragraphs: {type: integer, minimum: 1, maximum: 300, default: 60}
        max_chars: {type: integer, minimum: 500, maximum: 60000, default: 20000}
    outputs: {type: object, required: [document_id, title, revision_id, paragraphs, total_paragraphs], properties: {document_id: {type: string}, title: {type: string}, revision_id: {type: string}, link: {type: string}, tabs: {type: array, items: {type: object}}, total_paragraphs: {type: integer}, from: {type: integer}, paragraphs: {type: array, items: {type: object}}, next_from: {type: integer}, blank_skipped: {type: integer}}}
  - id: docs_create
    name: Create a Google Doc
    description: A new document titled title, with paragraphs if given, in a folder if given. On the person's go-ahead.
    level: 2
    timeout_seconds: 60
    calls: *write
    inputs:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        account: *account
        title: {type: string, minLength: 1, maxLength: 300}
        paragraphs: {type: array, maxItems: 200, items: {type: string, maxLength: 8000}}
        folder_id: {type: string, maxLength: 200}
        folder_path: {type: string, maxLength: 400}
    outputs: {type: object, required: [document_id, link], properties: {document_id: {type: string}, title: {type: string}, link: {type: string}, paragraphs: {type: integer}, folder: {type: string}}}
  - id: docs_insert
    name: Add Paragraphs to a Doc
    description: >
      New paragraphs after paragraph after_paragraph (a number from docs_read; 0 for the very top), or at the end of the
      tab's body when left out. Refused if the document changed since it was read. On the person's go-ahead.
    level: 2
    timeout_seconds: 60
    calls: *write
    inputs:
      type: object
      additionalProperties: false
      required: [document_id, paragraphs]
      properties:
        account: *account
        document_id: {type: string, minLength: 1, maxLength: 200}
        paragraphs: {type: array, minItems: 1, maxItems: 50, items: {type: string, maxLength: 8000}}
        after_paragraph: {type: integer, minimum: 0}
        tab: {type: string, maxLength: 200}
        style: {type: string, enum: [NORMAL_TEXT, TITLE, SUBTITLE, HEADING_1, HEADING_2, HEADING_3, HEADING_4], default: NORMAL_TEXT}
    outputs: {type: object, required: [inserted], properties: {inserted: {type: integer}, document_id: {type: string}, revision_id: {type: string}, link: {type: string}}}
  - id: edits_propose
    name: Propose a Doc Edit
    description: >
      Record a change to one paragraph (its number from docs_read): the text as read, the new text (one paragraph), and the
      document's revision. Nothing in the document changes; show both texts and ask before edits_apply.
    level: 1
    timeout_seconds: 60
    calls: ['record.list:google', 'record.read:google', 'record.create:google', 'record.create:edit']
    inputs:
      type: object
      additionalProperties: false
      required: [document_id, paragraph, new_text]
      properties:
        account: *account
        document_id: {type: string, minLength: 1, maxLength: 200}
        paragraph: {type: integer, minimum: 1}
        new_text: {type: string, maxLength: 8000}
        note: {type: string, maxLength: 500}
    outputs: {type: object, required: [edit_ref, old_text, new_text], properties: {edit_ref: {type: string}, title: {type: string}, paragraph: {type: integer}, tab: {type: string}, part: {type: string}, old_text: {type: string}, new_text: {type: string}, revision_id: {type: string}, link: {type: string}}}
  - id: edits_apply
    name: Apply a Doc Edit
    description: Apply a proposed edit; refused, and nothing written, if the document changed since it was proposed. On the person's go-ahead.
    level: 2
    timeout_seconds: 60
    calls: ['record.list:google', 'record.read:google', 'record.create:google', 'record.read:edit', 'record.update:edit']
    inputs: {type: object, additionalProperties: false, required: [edit_ref], properties: {account: *account, edit_ref: {type: string, maxLength: 100}}}
    outputs: {type: object, required: [applied], properties: {applied: {type: boolean}, status: {type: string}, paragraph: {type: integer}, revision_id: {type: string}, link: {type: string}}}
  - id: edits_discard
    name: Discard a Doc Edit
    description: Mark a proposed edit discarded; an applied one cannot be.
    level: 1
    timeout_seconds: 30
    calls: ['record.read:edit', 'record.update:edit']
    inputs: {type: object, additionalProperties: false, required: [edit_ref], properties: {edit_ref: {type: string, maxLength: 100}}}
    outputs: {type: object, required: [discarded], properties: {discarded: {type: boolean}}}
  # -- comments -------------------------------------------------------------------------------------------------------
  - id: comments_list
    name: Read Comments
    description: A file's open comments (all with include_resolved), with the words they quote, who wrote them, and the latest replies. Use page_token to continue.
    level: 0
    timeout_seconds: 60
    calls: *read
    inputs:
      type: object
      additionalProperties: false
      required: [file_id]
      properties:
        account: *account
        file_id: {type: string, minLength: 1, maxLength: 200}
        include_resolved: {type: boolean, default: false}
        max_results: {type: integer, minimum: 1, maximum: 100, default: 20}
        page_token: {type: string, maxLength: 4000}
    outputs: {type: object, required: [comments, replies], properties: {comments: {type: array, items: {type: object}}, replies: {type: array, items: {type: object}}, next_page_token: {type: string}}}
  - id: comments_add
    name: Add a Comment
    description: A comment on a file, seen by everyone who can open it; on a Google Doc it may quote words copied exactly from docs_read. On the person's go-ahead.
    level: 3
    timeout_seconds: 60
    calls: *write
    inputs:
      type: object
      additionalProperties: false
      required: [file_id, text]
      properties:
        account: *account
        file_id: {type: string, minLength: 1, maxLength: 200}
        text: {type: string, minLength: 1, maxLength: 4000}
        quote: {type: string, maxLength: 1000}
    outputs: {type: object, required: [comment_id], properties: {comment_id: {type: string}, created: {type: string}}}
  - id: comments_reply
    name: Reply to a Comment
    description: A reply to a comment, seen by everyone who can open the file. On the person's go-ahead.
    level: 3
    timeout_seconds: 60
    calls: *write
    inputs:
      type: object
      additionalProperties: false
      required: [file_id, comment_id, text]
      properties:
        account: *account
        file_id: {type: string, minLength: 1, maxLength: 200}
        comment_id: {type: string, minLength: 1, maxLength: 200}
        text: {type: string, minLength: 1, maxLength: 4000}
    outputs: {type: object, required: [reply_id], properties: {reply_id: {type: string}, created: {type: string}}}
  - id: comments_resolve
    name: Resolve a Comment
    description: Mark a comment resolved, with an optional closing reply. On the person's go-ahead.
    level: 3
    timeout_seconds: 60
    calls: *write
    inputs:
      type: object
      additionalProperties: false
      required: [file_id, comment_id]
      properties:
        account: *account
        file_id: {type: string, minLength: 1, maxLength: 200}
        comment_id: {type: string, minLength: 1, maxLength: 200}
        text: {type: string, maxLength: 4000}
    outputs: {type: object, required: [resolved], properties: {resolved: {type: boolean}, already: {type: boolean}, reply_id: {type: string}}}
  - id: comments_watch
    name: Watch Comments
    description: Start hearing about new comments and replies on a file, from now. What the account writes itself is never news.
    level: 1
    timeout_seconds: 90
    calls: *start
    inputs:
      type: object
      additionalProperties: false
      required: [file_id]
      properties:
        account: *account
        file_id: {type: string, minLength: 1, maxLength: 200}
        note: {type: string, maxLength: 500}
    outputs: *started
  - id: comments_new
    name: New Comments
    description: Comments and replies others wrote since the last check of each comments watch (or the one named), oldest first. Schedulable.
    level: 1
    timeout_seconds: 180
    schedulable: true
    calls: *check
    inputs: *check_inputs
    outputs: *checked
  # -- sheets ---------------------------------------------------------------------------------------------------------
  - id: sheets_get
    name: Spreadsheet Tabs
    description: A spreadsheet's title, link, locale, time zone, and every tab with its grid size. Read it before anything else.
    level: 0
    timeout_seconds: 30
    calls: *read
    inputs: &spreadsheet {type: object, additionalProperties: false, required: [spreadsheet_id], properties: {account: *account, spreadsheet_id: {type: string, minLength: 1, maxLength: 200}}}
    outputs: {type: object, required: [spreadsheet_id, tabs], properties: {spreadsheet_id: {type: string}, title: {type: string}, link: {type: string}, locale: {type: string}, time_zone: {type: string}, tab_count: {type: integer}, tabs: {type: array, items: {type: object}}}}
  - id: sheets_read
    name: Read Rows
    description: >
      A window of a tab: rows from from_row (after the header by default), at most max_rows, optionally only columns
      ("B:F"). header_row names the header row (1 by default, 0 for none) and it is read every time. values is formatted
      (as shown), raw (numbers as numbers) or formulas. next_row continues.
    level: 0
    timeout_seconds: 60
    calls: *read
    inputs:
      type: object
      additionalProperties: false
      required: [spreadsheet_id, tab]
      properties:
        account: *account
        spreadsheet_id: {type: string, minLength: 1, maxLength: 200}
        tab: {type: string, minLength: 1, maxLength: 200}
        header_row: {type: integer, minimum: 0, default: 1}
        from_row: {type: integer, minimum: 1}
        max_rows: {type: integer, minimum: 1, maximum: 200, default: 50}
        columns: {type: string, maxLength: 20}
        values: {type: string, enum: [formatted, raw, formulas], default: formatted}
    outputs: {type: object, required: [tab, header, rows, first_row], properties: {tab: {type: string}, header_row: {type: integer}, header: {type: array}, rows: {type: array, items: {type: array}}, first_row: {type: integer}, last_row: {type: integer}, shown_rows: {type: integer}, grid_rows: {type: integer}, next_row: {type: integer}, clipped_cells: {type: integer}, note: {type: string}}}
  - id: sheets_append
    name: Add Rows
    description: >
      Rows added after the tab's table; nothing below it is overwritten. Values are stored as given (a number as a number,
      text as text, so text starting with = + - @ stays text); formulas true only when the person asks for formulas. On the
      person's go-ahead.
    level: 2
    timeout_seconds: 60
    calls: &sheet_write ['record.list:google', 'record.read:google', 'record.create:google', 'record.create:write']
    inputs:
      type: object
      additionalProperties: false
      required: [spreadsheet_id, tab, rows]
      properties:
        account: *account
        spreadsheet_id: {type: string, minLength: 1, maxLength: 200}
        tab: {type: string, minLength: 1, maxLength: 200}
        rows: &rows {type: array, minItems: 1, maxItems: 500, items: {type: array, minItems: 1, maxItems: 100, items: {type: [string, number, boolean, 'null'], maxLength: 50000}}}
        formulas: {type: boolean, default: false}
    outputs: {type: object, required: [write_ref, updated_range], properties: {write_ref: {type: string}, updated_range: {type: string}, updated_rows: {type: integer}, as: {type: string}}}
  - id: sheets_update
    name: Overwrite Cells
    description: >
      Cells overwritten from start_cell ("B2"); what they held is read first, returned and kept. Values as in sheets_append.
      On the person's go-ahead.
    level: 2
    timeout_seconds: 60
    calls: *sheet_write
    inputs:
      type: object
      additionalProperties: false
      required: [spreadsheet_id, tab, start_cell, rows]
      properties:
        account: *account
        spreadsheet_id: {type: string, minLength: 1, maxLength: 200}
        tab: {type: string, minLength: 1, maxLength: 200}
        start_cell: {type: string, maxLength: 12}
        rows: *rows
        formulas: {type: boolean, default: false}
    outputs: {type: object, required: [write_ref, updated_range], properties: {write_ref: {type: string}, updated_range: {type: string}, updated_cells: {type: integer}, previous: {type: array}}}
  - id: sheets_create
    name: Create a Spreadsheet
    description: A new spreadsheet titled title, with the tabs named (one by default) and a header row on each if given, in a folder if given. On the person's go-ahead.
    level: 2
    timeout_seconds: 90
    calls: *write
    inputs:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        account: *account
        title: {type: string, minLength: 1, maxLength: 300}
        tabs: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 100}}
        header: {type: array, maxItems: 100, items: {type: [string, number]}}
        folder_id: {type: string, maxLength: 200}
        folder_path: {type: string, maxLength: 400}
    outputs: {type: object, required: [spreadsheet_id, link], properties: {spreadsheet_id: {type: string}, title: {type: string}, tabs: {type: array, items: {type: string}}, link: {type: string}}}
  - id: sheets_add_tab
    name: Add a Tab
    description: A new tab in a spreadsheet, with a header row if given. On the person's go-ahead.
    level: 2
    timeout_seconds: 60
    calls: *write
    inputs:
      type: object
      additionalProperties: false
      required: [spreadsheet_id, title]
      properties:
        account: *account
        spreadsheet_id: {type: string, minLength: 1, maxLength: 200}
        title: {type: string, minLength: 1, maxLength: 100}
        header: {type: array, maxItems: 100, items: {type: [string, number]}}
    outputs: {type: object, required: [tab], properties: {tab: {type: string}, sheet_id: {type: integer}}}
  - id: sheets_find
    name: Find a Value
    description: The cells holding text (contains, or exact), in one tab or every tab, with their addresses.
    level: 0
    timeout_seconds: 180
    calls: *read
    inputs:
      type: object
      additionalProperties: false
      required: [spreadsheet_id, text]
      properties:
        account: *account
        spreadsheet_id: {type: string, minLength: 1, maxLength: 200}
        text: {type: string, minLength: 1, maxLength: 500}
        tab: {type: string, maxLength: 200}
        match: {type: string, enum: [contains, exact], default: contains}
        max_results: {type: integer, minimum: 1, maximum: 200, default: 20}
    outputs: {type: object, required: [matches], properties: {matches: {type: array, items: {type: object}}, scanned_rows: {type: integer}, cut_short: {type: boolean}, more: {type: boolean}}}
  - id: sheets_totals
    name: Column Totals
    description: >
      Sum, count, min, max and average of columns (letters or header names), counted here in exact decimals from the
      cells' numbers, optionally per value of group_by; text cells are counted apart, never guessed as numbers.
    level: 0
    timeout_seconds: 180
    calls: *read
    inputs:
      type: object
      additionalProperties: false
      required: [spreadsheet_id, tab, columns]
      properties:
        account: *account
        spreadsheet_id: {type: string, minLength: 1, maxLength: 200}
        tab: {type: string, minLength: 1, maxLength: 200}
        columns: {type: array, minItems: 1, maxItems: 10, items: {type: string, maxLength: 200}}
        group_by: {type: string, maxLength: 200}
        header_row: {type: integer, minimum: 0, default: 1}
        from_row: {type: integer, minimum: 1}
        to_row: {type: integer, minimum: 1}
    outputs: {type: object, required: [columns, rows], properties: {tab: {type: string}, rows: {type: integer}, from_row: {type: integer}, columns: {type: array, items: {type: object}}, groups: {type: array, items: {type: object}}, groups_cut: {type: boolean}, cut_short: {type: boolean}}}
  - id: rows_watch
    name: Watch for New Rows
    description: Start hearing about rows added to a tab, from now; header_row names the header (1 by default, 0 for none).
    level: 1
    timeout_seconds: 120
    calls: *start
    inputs:
      type: object
      additionalProperties: false
      required: [spreadsheet_id, tab]
      properties:
        account: *account
        spreadsheet_id: {type: string, minLength: 1, maxLength: 200}
        tab: {type: string, minLength: 1, maxLength: 200}
        header_row: {type: integer, minimum: 0, default: 1}
        note: {type: string, maxLength: 500}
    outputs: *started
  - id: rows_new
    name: New Rows
    description: >
      Rows added since the last check of each rows watch (or the one named), keyed by column name; a row deleted and
      another added in between is still seen. An event reset says the tab was sorted or rewritten. Schedulable.
    level: 1
    timeout_seconds: 180
    schedulable: true
    calls: *check
    inputs: *check_inputs
    outputs: *checked
  # -- forms ----------------------------------------------------------------------------------------------------------
  - id: forms_get
    name: Form Questions
    description: A form's title, description, the link people answer at, its linked spreadsheet, and every question with its kind and options.
    level: 0
    timeout_seconds: 30
    calls: *read
    inputs: &form {type: object, additionalProperties: false, required: [form_id], properties: {account: *account, form_id: {type: string, minLength: 1, maxLength: 200}}}
    outputs: {type: object, required: [form_id, questions], properties: {form_id: {type: string}, title: {type: string}, description: {type: string}, responder_link: {type: string}, linked_spreadsheet_id: {type: string}, question_count: {type: integer}, questions: {type: array, items: {type: object}}}}
  - id: responses_list
    name: Read Responses
    description: >
      A page of a form's responses keyed by question title, newest first within the page, optionally only those
      submitted since a time (ISO 8601 with a zone). Pass page_token, with the same since, to continue.
    level: 0
    timeout_seconds: 60
    calls: *read
    inputs:
      type: object
      additionalProperties: false
      required: [form_id]
      properties:
        account: *account
        form_id: {type: string, minLength: 1, maxLength: 200}
        since: {type: string, maxLength: 40}
        max_results: {type: integer, minimum: 1, maximum: 100, default: 25}
        page_token: {type: string, maxLength: 4000}
    outputs: {type: object, required: [responses], properties: {form: {type: string}, responses: {type: array, items: {type: object}}, next_page_token: {type: string}}}
  - id: responses_tally
    name: Count Answers
    description: 'Every response counted per question, here, never by the model: how many answered, each option''s count, a scale''s average. Optionally only since a time.'
    level: 0
    timeout_seconds: 180
    calls: *read
    inputs:
      type: object
      additionalProperties: false
      required: [form_id]
      properties:
        account: *account
        form_id: {type: string, minLength: 1, maxLength: 200}
        since: {type: string, maxLength: 40}
    outputs: {type: object, required: [responses, questions], properties: {form: {type: string}, responses: {type: integer}, cut_short: {type: boolean}, since: {type: string}, questions: {type: array, items: {type: object}}}}
  - id: responses_watch
    name: Watch for New Responses
    description: Start hearing about a form's new responses, from now.
    level: 1
    timeout_seconds: 120
    calls: *start
    inputs:
      type: object
      additionalProperties: false
      required: [form_id]
      properties:
        account: *account
        form_id: {type: string, minLength: 1, maxLength: 200}
        note: {type: string, maxLength: 500}
    outputs: *started
  - id: responses_new
    name: New Responses
    description: Responses submitted since the last check of each responses watch (or the one named), oldest first. Schedulable.
    level: 1
    timeout_seconds: 180
    schedulable: true
    calls: *check
    inputs: *check_inputs
    outputs: *checked
  # -- watches --------------------------------------------------------------------------------------------------------
  - id: watches_list
    name: List Watches
    description: The person's watches (changes, comments, rows, responses), active ones unless include_closed.
    level: 0
    timeout_seconds: 30
    calls: ['record.list:watch']
    inputs:
      type: object
      additionalProperties: false
      properties:
        kind: {type: string, enum: [changes, comments, rows, responses]}
        include_closed: {type: boolean, default: false}
    outputs: {type: object, required: [watches], properties: {watches: {type: array, items: {type: object}}}}
  - id: watches_close
    name: Stop a Watch
    description: Stop a watch for good; a schedule that checks it hears nothing more from it.
    level: 1
    timeout_seconds: 30
    calls: ['record.read:watch', 'record.update:watch']
    inputs: {type: object, additionalProperties: false, required: [watch_ref], properties: {watch_ref: {type: string, maxLength: 100}}}
    outputs: {type: object, required: [watch_ref, closed], properties: {watch_ref: {type: string}, closed: {type: boolean}, already: {type: boolean}}}
