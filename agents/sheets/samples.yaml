# Sample data: what the example prompts name. A supplier price list with the faults they ask about (a duplicated row,
# a missing price, a price that is not a number) and the catalog to reconcile it with; the Arabic branch sales report
# as Excel saves it in the Gulf (titles above the header, semicolons, a decimal comma); and an order export with gaps
# (one order with no total and no city, one with no lines) with the schema it should meet.
story: Sidra Office Supplies — a price list with faults, its catalog, Arabic branch sales, and an order export to check.

files:
  - ref: prices
    resource: source
    path: samples/supplier-price-list.csv
  - ref: catalog
    resource: source
    path: samples/product-catalog.csv
  - ref: branch_sales
    resource: source
    path: samples/branch-sales-ar.csv
  - ref: orders
    resource: source
    path: samples/orders-export.json
  - ref: schema
    resource: source
    path: samples/order-schema.json
