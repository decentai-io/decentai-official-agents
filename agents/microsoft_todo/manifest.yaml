schema: 3
agent:
  id: microsoft_todo
  name: Microsoft To Do
  version: "1.0.0"
  description: >
    Your Microsoft To Do lists, read and kept through the assistant. See what is open and what is due, add and edit tasks,
    tick them off or reopen them, and be told when something was completed or changed in To Do — so the tasks you keep here
    and there stay in step. Deleting a task waits for your go-ahead.
  instructions: >
    Use this agent for the user's own Microsoft To Do lists. Find a list with lists_list and a task with tasks_list before
    changing anything; every task is addressed by its list_id and task_id, which are Microsoft's own — pass them on unchanged
    and never invent one. Due dates are YYYY-MM-DD; a reminder is an ISO 8601 date-time with an offset. When a date is ambiguous
    ("Thursday") say which date you took. Creating, editing, completing and reopening a task are ordinary changes; tasks_delete
    cannot be undone and needs the user's explicit go-ahead. KEEPING IN STEP WITH THE TASKS AGENT — agents cannot call each
    other, so you carry the task across. To copy a To Do task into Tasks: read it here (tasks_get), then tasks_create in
    the Tasks agent with the same title and due date and source exactly "microsoft_todo:<task_id>". To copy a Tasks item
    into To Do: tasks_create here with its title and due date, and end the note with "Tasks item: <task_ref>". To pull what
    was ticked off in To Do: record a watch ONCE (sync_watch, one list or every list) and schedule sync_completed; for each
    row it returns, find the matching Tasks item (tasks_list with source "microsoft_todo:<task_id>", or the task_ref
    named in the row's note) and mark it done with tasks_update: status done, done_on the row's completed date, evidence
    "Completed in Microsoft To Do on <completed>". Tasks already done there need nothing. For any edit made in To Do, schedule
    sync_changed instead. Never record a second watch for the same request.
  examples:
    - title: What is open
      prompt: What is still open on my Microsoft To Do list, and what is due this week?
    - title: Add a task
      prompt: Add "Send the chair quotation to Dana" to my To Do list, due Thursday, high importance.
    - title: Keep in step
      prompt: Every morning, check what I ticked off in Microsoft To Do and mark the matching tasks done here.
  tags: [tasks, to-do, microsoft, productivity]
network: {hosts: [graph.microsoft.com]}
resources:
  secrets:
    - id: microsoft
      label: Microsoft Account
      description: >
        A Microsoft 365 account, connected by signing in — the same connection the Outlook, Microsoft Calendar, OneDrive
        and Teams agents use; grant one saved account to all of them. The platform keeps and refreshes the tokens; this
        agent receives a short-lived access token. api_base_url is for tests only; leave it empty.
      binding: {cardinality: one, required: true}
      oauth:
        provider: microsoft
        authorize_url: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
        token_url: https://login.microsoftonline.com/common/oauth2/v2.0/token
        scopes:
          - openid
          - email
          - offline_access
          - User.Read
          - Mail.ReadWrite
          - Mail.Send
          - Calendars.ReadWrite
          - Files.ReadWrite.All
          - Chat.ReadWrite
          - Team.ReadBasic.All
          - Channel.ReadBasic.All
          - ChannelMessage.Send
          - Tasks.ReadWrite
        identity: {url: 'https://graph.microsoft.com/v1.0/me', field: userPrincipalName}
      fields:
        - name: api_base_url
          label: API Base URL (tests only)
          type: string
          storage: keys
          required: false
  data:
    - id: watch
      label: To Do Watch
      description: >
        How far one list (or every list) has been read on the user's behalf: for completions and for any change, the time
        of the newest task handed on (Graph's clock, UTC) and the ids that sit exactly on that second.
      binding: {cardinality: many, required: false}
      fields:
        - {name: list_id, label: List ID, type: string, storage: keys, required: false}
        - {name: list_name, label: List, type: string, storage: keys, required: false}
        - name: completed_since
          label: Completions Read Up To
          type: string
          storage: keys
          required: true
        - name: completed_ids
          label: Completed At That Second
          type: string
          storage: keys
          required: false
        - {name: changed_since, label: Changes Read Up To, type: string, storage: keys, required: true}
        - {name: changed_ids, label: Changed At That Second, type: string, storage: keys, required: false}
        - name: status
          label: Status
          type: select
          storage: keys
          required: true
          options: [watching, closed]
        - {name: note, label: Note, type: string, storage: keys, required: false}
functions:
  - id: account_status
    name: Account Status
    description: Confirm the Microsoft connection works and which address it is.
    level: 0
    timeout_seconds: 30
    calls: ['record.list:microsoft', 'record.read:microsoft']
    inputs: {type: object, additionalProperties: false, properties: {}}
    outputs:
      type: object
      required: [connected, email]
      properties: {connected: {type: boolean}, email: {type: string}, problem: {type: string}}
  - id: lists_list
    name: List Task Lists
    description: >
      The account's To Do lists with their ids. kind "defaultList" is where tasks go when no list is named; "flaggedEmails"
      holds Outlook's flagged mail.
    level: 0
    timeout_seconds: 30
    calls: ['record.list:microsoft', 'record.read:microsoft', 'record.create:microsoft']
    inputs:
      type: object
      additionalProperties: false
      properties: {max_results: {type: integer, minimum: 1, maximum: 25, default: 20}}
    outputs:
      type: object
      required: [lists, more]
      properties:
        more: {type: boolean}
        lists:
          type: array
          items:
            type: object
            properties: {list_id: {type: string}, name: {type: string}, kind: {type: string}, shared: {type: boolean}}
  - id: lists_create
    name: Create Task List
    description: Make a new To Do list in the account.
    level: 1
    timeout_seconds: 30
    calls: ['record.list:microsoft', 'record.read:microsoft', 'record.create:microsoft']
    inputs:
      type: object
      additionalProperties: false
      required: [name]
      properties: {name: {type: string, minLength: 1, maxLength: 200}}
    outputs:
      type: object
      required: [list_id, name]
      properties: {list_id: {type: string}, name: {type: string}, kind: {type: string}, shared: {type: boolean}}
  - id: tasks_list
    name: List Tasks
    description: >
      A list's tasks (the default list when list_id is not given), most recently changed first: status "open" (default),
      "completed" or "all", and only those due before due_before (YYYY-MM-DD) when given. Notes are clipped; tasks_get reads
      one whole. Use page_token, with the same list_id, to continue.
    level: 0
    timeout_seconds: 45
    calls: ['record.list:microsoft', 'record.read:microsoft', 'record.create:microsoft']
    inputs:
      type: object
      additionalProperties: false
      properties:
        list_id: {type: string, maxLength: 400}
        status: {type: string, enum: [open, completed, all], default: open}
        due_before: {type: string, maxLength: 10}
        max_results: {type: integer, minimum: 1, maximum: 25, default: 20}
        page_token: {type: string, maxLength: 4000}
    outputs:
      type: object
      required: [list_id, tasks]
      properties:
        list_id: {type: string}
        tasks:
          type: array
          items:
            type: object
            properties:
              task_id: {type: string}
              list_id: {type: string}
              title: {type: string}
              status: {type: string}
              importance: {type: string}
              due: {type: string}
              completed: {type: string}
              modified: {type: string}
              reminder: {type: string}
              note: {type: string}
        next_page_token: {type: string}
  - id: tasks_get
    name: Get Task
    description: >
      One task whole: its note (cut at max_note_chars) and its checklist items, each ticked or not.
    level: 0
    timeout_seconds: 30
    calls: ['record.list:microsoft', 'record.read:microsoft', 'record.create:microsoft']
    inputs:
      type: object
      additionalProperties: false
      required: [list_id, task_id]
      properties:
        list_id: {type: string, minLength: 1, maxLength: 400}
        task_id: {type: string, minLength: 1, maxLength: 400}
        max_note_chars: {type: integer, minimum: 200, maximum: 20000, default: 2000}
    outputs:
      type: object
      required: [task_id, list_id, title, status, note, note_truncated, checklist]
      properties:
        task_id: {type: string}
        list_id: {type: string}
        title: {type: string}
        status: {type: string}
        importance: {type: string}
        due: {type: string}
        completed: {type: string}
        created: {type: string}
        modified: {type: string}
        reminder: {type: string}
        note: {type: string}
        note_truncated: {type: boolean}
        checklist:
          type: array
          items:
            type: object
            properties: {item_id: {type: string}, title: {type: string}, checked: {type: boolean}}
  - id: tasks_create
    name: Create Task
    description: >
      Add a task to a list (the default list when list_id is not given): title, due (YYYY-MM-DD), importance, a note, and
      a reminder (ISO 8601 with an offset). A private task in the user's own account.
    level: 1
    timeout_seconds: 30
    calls: ['record.list:microsoft', 'record.read:microsoft', 'record.create:microsoft']
    inputs:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        list_id: {type: string, maxLength: 400}
        title: {type: string, minLength: 1, maxLength: 255}
        due: {type: string, maxLength: 10}
        importance: {type: string, enum: [low, normal, high]}
        note: {type: string, maxLength: 4000}
        reminder: {type: string, maxLength: 40}
    outputs:
      type: object
      required: [task_id, list_id, title, status]
      properties:
        task_id: {type: string}
        list_id: {type: string}
        title: {type: string}
        status: {type: string}
        importance: {type: string}
        due: {type: string}
        completed: {type: string}
        modified: {type: string}
        reminder: {type: string}
        note: {type: string}
  - id: tasks_update
    name: Update Task
    description: >
      Change a task's title, due date, importance, note or reminder. Only what is given changes; an empty due or reminder
      clears it.
    level: 1
    timeout_seconds: 30
    calls: ['record.list:microsoft', 'record.read:microsoft', 'record.create:microsoft']
    inputs:
      type: object
      additionalProperties: false
      required: [list_id, task_id]
      properties:
        list_id: {type: string, minLength: 1, maxLength: 400}
        task_id: {type: string, minLength: 1, maxLength: 400}
        title: {type: string, minLength: 1, maxLength: 255}
        due: {type: string, maxLength: 10}
        importance: {type: string, enum: [low, normal, high]}
        note: {type: string, maxLength: 4000}
        reminder: {type: string, maxLength: 40}
    outputs:
      type: object
      required: [task_id, list_id, title, status]
      properties:
        task_id: {type: string}
        list_id: {type: string}
        title: {type: string}
        status: {type: string}
        importance: {type: string}
        due: {type: string}
        completed: {type: string}
        modified: {type: string}
        reminder: {type: string}
        note: {type: string}
  - id: tasks_complete
    name: Complete Task
    description: Tick a task off; Microsoft records when.
    level: 1
    timeout_seconds: 30
    calls: ['record.list:microsoft', 'record.read:microsoft', 'record.create:microsoft']
    inputs:
      type: object
      additionalProperties: false
      required: [list_id, task_id]
      properties:
        list_id: {type: string, minLength: 1, maxLength: 400}
        task_id: {type: string, minLength: 1, maxLength: 400}
    outputs:
      type: object
      required: [task_id, list_id, title, status]
      properties:
        task_id: {type: string}
        list_id: {type: string}
        title: {type: string}
        status: {type: string}
        importance: {type: string}
        due: {type: string}
        completed: {type: string}
        modified: {type: string}
        reminder: {type: string}
        note: {type: string}
  - id: tasks_reopen
    name: Reopen Task
    description: Mark a completed task not started again.
    level: 1
    timeout_seconds: 30
    calls: ['record.list:microsoft', 'record.read:microsoft', 'record.create:microsoft']
    inputs:
      type: object
      additionalProperties: false
      required: [list_id, task_id]
      properties:
        list_id: {type: string, minLength: 1, maxLength: 400}
        task_id: {type: string, minLength: 1, maxLength: 400}
    outputs:
      type: object
      required: [task_id, list_id, title, status]
      properties:
        task_id: {type: string}
        list_id: {type: string}
        title: {type: string}
        status: {type: string}
        importance: {type: string}
        due: {type: string}
        completed: {type: string}
        modified: {type: string}
        reminder: {type: string}
        note: {type: string}
  - id: tasks_delete
    name: Delete Task
    description: >
      Delete a task from Microsoft To Do. It cannot be undone — only on the user's explicit go-ahead.
    level: 3
    timeout_seconds: 30
    calls: ['record.list:microsoft', 'record.read:microsoft', 'record.create:microsoft']
    inputs:
      type: object
      additionalProperties: false
      required: [list_id, task_id]
      properties:
        list_id: {type: string, minLength: 1, maxLength: 400}
        task_id: {type: string, minLength: 1, maxLength: 400}
    outputs:
      type: object
      required: [deleted, task_id]
      properties: {deleted: {type: boolean}, task_id: {type: string}, title: {type: string}}
  - id: sync_watch
    name: Watch Lists
    description: >
      Start watching one list (list_id) or every list, from now (or from "since", an ISO 8601 date-time). Record it once,
      then schedule sync_completed or sync_changed.
    level: 1
    timeout_seconds: 45
    calls:
      - record.list:microsoft
      - record.read:microsoft
      - record.create:microsoft
      - record.create:watch
    inputs:
      type: object
      additionalProperties: false
      properties:
        list_id: {type: string, maxLength: 400}
        since: {type: string, maxLength: 40}
        note: {type: string, maxLength: 500}
    outputs:
      type: object
      required: [watch_ref, list_id, list_name, since]
      properties:
        watch_ref: {type: string}
        list_id: {type: string}
        list_name: {type: string}
        since: {type: string}
  - id: sync_completed
    name: Completed Since
    description: >
      Tasks ticked off since the last check, for every watch (or one, by watch_ref): one row per task, oldest first, with
      its list's name and its watch. Moves the watch's completion cursor; "more" says a later check continues. Safe to
      schedule: it runs unattended.
    level: 1
    timeout_seconds: 60
    schedulable: true
    calls:
      - record.list:microsoft
      - record.read:microsoft
      - record.create:microsoft
      - record.list:watch
      - record.read:watch
      - record.update:watch
    inputs:
      type: object
      additionalProperties: false
      properties: {watch_ref: {type: string}, max_results: {type: integer, minimum: 1, maximum: 25, default: 20}}
    outputs:
      type: object
      required: [checked, completed, more]
      properties:
        checked: {type: integer}
        more: {type: boolean}
        completed:
          type: array
          items:
            type: object
            properties:
              watch_ref: {type: string}
              list_id: {type: string}
              list_name: {type: string}
              task_id: {type: string}
              title: {type: string}
              status: {type: string}
              importance: {type: string}
              due: {type: string}
              completed: {type: string}
              modified: {type: string}
              reminder: {type: string}
              note: {type: string}
  - id: sync_changed
    name: Changed Since
    description: >
      Tasks created or changed since the last check — completions included — for every watch (or one, by watch_ref), oldest
      first, each with its status, list name and watch. Moves the watch's change cursor, separate from the completion cursor;
      "more" says a later check continues. Safe to schedule: it runs unattended.
    level: 1
    timeout_seconds: 60
    schedulable: true
    calls:
      - record.list:microsoft
      - record.read:microsoft
      - record.create:microsoft
      - record.list:watch
      - record.read:watch
      - record.update:watch
    inputs:
      type: object
      additionalProperties: false
      properties: {watch_ref: {type: string}, max_results: {type: integer, minimum: 1, maximum: 25, default: 20}}
    outputs:
      type: object
      required: [checked, changed, more]
      properties:
        checked: {type: integer}
        more: {type: boolean}
        changed:
          type: array
          items:
            type: object
            properties:
              watch_ref: {type: string}
              list_id: {type: string}
              list_name: {type: string}
              task_id: {type: string}
              title: {type: string}
              status: {type: string}
              importance: {type: string}
              due: {type: string}
              completed: {type: string}
              modified: {type: string}
              reminder: {type: string}
              note: {type: string}
