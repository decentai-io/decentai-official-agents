  - ref: lease_summary_ar
    resource: source
    path: samples/lease-summary-ar.md
  - ref: proposal_v1
    resource: source
    path: samples/harbourline-proposal-v1.md
  - ref: proposal_v2
    resource: source
    path: samples/harbourline-proposal-v2.md
  - ref: invoice
    resource: source
    path: samples/invoice-INV-1043.pdf
  - ref: invoice_scan
    resource: source
    path: samples/invoice-INV-1043-scan.png
  - ref: review
    resource: source
    path: samples/sidra-q3-review.pptx
