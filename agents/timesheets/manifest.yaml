schema: 3
agent:
  id: timesheets
  name: Timesheets
  version: "1.0.0"
  description: >
    Where your week went, by project. Log hours, turn calendar meetings into entries by your own rules, see the week's totals
    and gaps, lock it when it is handed in, and get the workbook to send.
  instructions: >
    Use this agent to keep a timesheet. Projects are addressed by short code (SHOW, MOVE); projects_list shows them with
    hours logged against any budget. Hours are decimal (1.5) or a start and end time (HH:MM); dates are YYYY-MM-DD; a week
    is an ISO week like 2026-W37. To log meetings, list them with a calendar agent first and pass the rows unchanged to
    entries_from_events; the user's rules place them, and the ones it returns as unassigned must be put to the user — never
    pick a project yourself. Pass the user's answers back as assign, an event_id and project_code for each; a meeting already
    logged is never logged twice. weeks_summary shows the week and its gaps; weeks_submit locks it, and a submitted week
    changes only after weeks_reopen. weeks_workbook produces the file to send; sending it is the mail agent's job.
  examples:
    - title: Log it
      prompt: Log 2.5 hours on the showroom project today — layout review with Harbourline.
    - title: From my calendar
      prompt: Turn this week's meetings into timesheet entries, and tell me which ones you could not place.
    - {title: The week, prompt: 'What does my week of 7 September look like, and where are the gaps?'}
  tags: [timesheets, time, projects, productivity]
network: {hosts: []}
resources:
  data:
    - id: project
      label: Project
      description: Something time is logged against.
      binding: {cardinality: many, required: false}
      user_access: [create, update]
      fields:
        - {name: code, label: Code, type: string, storage: keys, required: true}
        - {name: name, label: Name, type: string, storage: keys, required: true}
        - {name: client, label: Client, type: string, storage: keys, required: false}
        - name: billable
          label: Billable
          type: select
          storage: keys
          required: true
          options: ['yes', 'no']
        - name: status
          label: Status
          type: select
          storage: keys
          required: true
          options: [active, archived]
        - {name: budget_hours, label: Budget Hours, type: string, storage: keys, required: false}
    - id: rule
      label: Rule
      description: >
        Places a meeting on a project when its title, an attendee or its location contains the text.
      binding: {cardinality: many, required: false}
      fields:
        - {name: match, label: Contains, type: string, storage: keys, required: true}
        - name: field
          label: In
          type: select
          storage: keys
          required: true
          options: [title, attendee, location]
        - {name: project_code, label: Project, type: string, storage: keys, required: true}
    - id: entry
      label: Time Entry
      description: Hours on one project on one day.
      binding: {cardinality: many, required: false}
      fields:
        - {name: date, label: Date, type: string, storage: keys, required: true}
        - {name: week, label: Week, type: string, storage: keys, required: true}
        - {name: project_code, label: Project, type: string, storage: keys, required: true}
        - {name: hours, label: Hours, type: string, storage: keys, required: true}
        - {name: note, label: Note, type: string, storage: keys, required: false}
        - name: source
          label: Source
          type: select
          storage: keys
          required: true
          options: [manual, calendar]
        - {name: event_id, label: Event ID, type: string, storage: keys, required: false}
        - name: status
          label: Status
          type: select
          storage: keys
          required: true
          options: [draft, submitted]
    - id: week
      label: Week
      description: A week handed in, and when.
      binding: {cardinality: many, required: false}
      fields:
        - {name: week, label: Week, type: string, storage: keys, required: true}
        - name: status
          label: Status
          type: select
          storage: keys
          required: true
          options: [open, submitted]
        - {name: submitted_on, label: Submitted On, type: string, storage: keys, required: false}
        - {name: total_hours, label: Total Hours, type: string, storage: keys, required: false}
functions:
  - id: projects_add
    name: Add Project
    description: A new project, by short code. Billable unless said otherwise.
    level: 1
    timeout_seconds: 30
    calls: ['record.list:project', 'record.create:project']
    inputs:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: {type: string, minLength: 1, maxLength: 20}
        name: {type: string, minLength: 1, maxLength: 200}
        client: {type: string, maxLength: 200}
        billable: {type: boolean, default: true}
        budget_hours: {type: number, minimum: 0}
    outputs: {type: object, required: [project], properties: {project: {type: object}}}
  - id: projects_list
    name: List Projects
    description: >
      Active projects (and archived ones on request), with hours logged and any budget left.
    level: 0
    timeout_seconds: 30
    calls: ['record.list:project', 'record.list:entry']
    inputs:
      type: object
      additionalProperties: false
      properties: {include_archived: {type: boolean, default: false}}
    outputs: {type: object, required: [projects], properties: {projects: {type: array, items: {type: object}}}}
  - id: projects_update
    name: Update Project
    description: Rename, re-client, change billable or budget, or archive a project.
    level: 1
    timeout_seconds: 30
    calls: ['record.list:project', 'record.update:project']
    inputs:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: {type: string, minLength: 1, maxLength: 20}
        name: {type: string, maxLength: 200}
        client: {type: string, maxLength: 200}
        billable: {type: boolean}
        status: {type: string, enum: [active, archived]}
        budget_hours: {type: number, minimum: 0}
    outputs: {type: object, required: [project], properties: {project: {type: object}}}
  - id: projects_add_rule
    name: Add Rule
    description: >
      Place meetings on a project when their title (the default), an attendee's address, or the location contains match.
    level: 1
    timeout_seconds: 30
    calls: ['record.list:project', 'record.list:rule', 'record.create:rule']
    inputs:
      type: object
      additionalProperties: false
      required: [match, project_code]
      properties:
        match: {type: string, minLength: 1, maxLength: 100}
        field: {type: string, enum: [title, attendee, location], default: title}
        project_code: {type: string, minLength: 1, maxLength: 20}
    outputs:
      type: object
      required: [rule_ref]
      properties:
        rule_ref: {type: string}
        match: {type: string}
        field: {type: string}
        project_code: {type: string}
  - id: projects_rules
    name: List Rules
    description: The rules that place meetings on projects.
    level: 0
    timeout_seconds: 30
    calls: ['record.list:rule']
    inputs: {type: object, additionalProperties: false, properties: {}}
    outputs: {type: object, required: [rules], properties: {rules: {type: array, items: {type: object}}}}
  - id: projects_remove_rule
    name: Remove Rule
    description: Stop a rule placing meetings. Entries it placed stay.
    level: 1
    timeout_seconds: 30
    calls: ['record.delete:rule']
    inputs:
      type: object
      additionalProperties: false
      required: [rule_ref]
      properties: {rule_ref: {type: string}}
    outputs:
      type: object
      required: [removed]
      properties: {removed: {type: boolean}, rule_ref: {type: string}}
  - id: entries_log
    name: Log Time
    description: >
      Hours on a project on a day (today by default): hours, or a start and end time rounded to the quarter hour. A day
      holds at most 24 hours; a submitted week takes nothing new.
    level: 1
    timeout_seconds: 30
    calls: ['record.list:entry', 'record.create:entry', 'record.list:project', 'record.list:week']
    inputs:
      type: object
      additionalProperties: false
      required: [project_code]
      properties:
        project_code: {type: string, minLength: 1, maxLength: 20}
        date: {type: string, maxLength: 10}
        hours: {type: number, minimum: 0, maximum: 24}
        start: {type: string, maxLength: 5}
        end: {type: string, maxLength: 5}
        note: {type: string, maxLength: 500}
    outputs:
      type: object
      required: [entry, day_total]
      properties: {entry: {type: object}, day_total: {type: number}}
  - id: entries_from_events
    name: Log Meetings
    description: >
      Turn calendar meetings (the rows a calendar agent lists) into entries, each rounded to the quarter hour on the day
      it took place. The user's rules place each one; assign (an event_id and project_code for each) places the rest. Returns
      what was logged, what could not be placed and why, and what was skipped — already logged, all-day, cancelled or declined,
      or in a submitted week.
    level: 1
    timeout_seconds: 60
    calls:
      - record.list:entry
      - record.create:entry
      - record.list:project
      - record.list:rule
      - record.list:week
    inputs:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [event_id]
            properties:
              event_id: {type: string, maxLength: 400}
              summary: {type: string, maxLength: 300}
              title: {type: string, maxLength: 300}
              start: {type: string, maxLength: 40}
              end: {type: string, maxLength: 40}
              all_day: {type: boolean}
              status: {type: string, maxLength: 40}
              response: {type: string, maxLength: 40}
              attendees: {type: string, maxLength: 4000}
              location: {type: string, maxLength: 300}
        assign:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [event_id, project_code]
            properties: {event_id: {type: string, maxLength: 400}, project_code: {type: string, maxLength: 20}}
    outputs:
      type: object
      required: [created, unassigned, skipped]
      properties:
        created: {type: array, items: {type: object}}
        unassigned: {type: array, items: {type: object}}
        skipped: {type: array, items: {type: object}}
  - id: entries_list
    name: List Entries
    description: >
      Entries in a week (this week by default) or between two dates, optionally for one project, with their total.
    level: 0
    timeout_seconds: 30
    calls: ['record.list:entry']
    inputs:
      type: object
      additionalProperties: false
      properties:
        week: {type: string, maxLength: 8}
        from_date: {type: string, maxLength: 10}
        to_date: {type: string, maxLength: 10}
        project_code: {type: string, maxLength: 20}
    outputs:
      type: object
      required: [entries, total]
      properties: {entries: {type: array, items: {type: object}}, total: {type: number}}
  - id: entries_update
    name: Update Entry
    description: Change an entry's hours, project, date or note, in a week not submitted.
    level: 1
    timeout_seconds: 30
    calls:
      - record.list:entry
      - record.read:entry
      - record.update:entry
      - record.list:project
      - record.list:week
    inputs:
      type: object
      additionalProperties: false
      required: [entry_ref]
      properties:
        entry_ref: {type: string}
        date: {type: string, maxLength: 10}
        project_code: {type: string, maxLength: 20}
        hours: {type: number, minimum: 0, maximum: 24}
        note: {type: string, maxLength: 500}
    outputs: {type: object, required: [entry], properties: {entry: {type: object}}}
  - id: entries_remove
    name: Remove Entry
    description: Take an entry off a week not submitted.
    level: 1
    timeout_seconds: 30
    calls: ['record.read:entry', 'record.delete:entry', 'record.list:week']
    inputs:
      type: object
      additionalProperties: false
      required: [entry_ref]
      properties: {entry_ref: {type: string}}
    outputs:
      type: object
      required: [removed]
      properties: {removed: {type: boolean}, entry_ref: {type: string}}
  - id: weeks_summary
    name: Week Summary
    description: >
      A week (this week by default) by project and day, with totals, billable hours, and the gaps — weekdays up to as_of
      (today by default) with fewer than daily_hours (8 by default).
    level: 0
    timeout_seconds: 30
    calls: ['record.list:entry', 'record.list:project', 'record.list:week']
    inputs:
      type: object
      additionalProperties: false
      properties:
        week: {type: string, maxLength: 8}
        as_of: {type: string, maxLength: 10}
        daily_hours: {type: number, minimum: 1, maximum: 24, default: 8}
    outputs:
      type: object
      required: [week, status, projects, day_totals, total, gaps]
      properties:
        week: {type: string}
        from: {type: string}
        to: {type: string}
        status: {type: string}
        dates: {type: array, items: {type: string}}
        projects: {type: array, items: {type: object}}
        day_totals: {type: array, items: {type: number}}
        total: {type: number}
        billable_hours: {type: number}
        gaps: {type: array, items: {type: object}}
        entries: {type: integer}
  - id: weeks_submit
    name: Submit Week
    description: >
      Hand a week in: its entries are locked until it is reopened. Returns its total and any gaps it was submitted with.
    level: 1
    timeout_seconds: 60
    calls:
      - record.list:entry
      - record.update:entry
      - record.list:project
      - record.list:week
      - record.create:week
      - record.update:week
    inputs:
      type: object
      additionalProperties: false
      properties:
        week: {type: string, maxLength: 8}
        as_of: {type: string, maxLength: 10}
        daily_hours: {type: number, minimum: 1, maximum: 24, default: 8}
    outputs:
      type: object
      required: [week, status, total, entries]
      properties:
        week: {type: string}
        status: {type: string}
        total: {type: number}
        entries: {type: integer}
        gaps: {type: array, items: {type: object}}
  - id: weeks_reopen
    name: Reopen Week
    description: Unlock a submitted week so its entries can change again.
    level: 1
    timeout_seconds: 60
    calls: ['record.list:entry', 'record.update:entry', 'record.list:week', 'record.update:week']
    inputs: {type: object, additionalProperties: false, properties: {week: {type: string, maxLength: 8}}}
    outputs:
      type: object
      required: [week, status]
      properties: {week: {type: string}, status: {type: string}}
  - id: weeks_workbook
    name: Timesheet Workbook
    description: >
      The week as an Excel workbook — the project-by-day grid and every entry — read back before it is handed to the
      person as this call's file.
    level: 2
    timeout_seconds: 60
    calls: ['record.list:entry', 'record.list:project', 'record.list:week']
    inputs: {type: object, additionalProperties: false, properties: {week: {type: string, maxLength: 8}}}
    outputs:
      type: object
      required: [file_ref, filename, total, verified]
      properties:
        file_ref: {type: string}
        filename: {type: string}
        total: {type: number}
        verified: {type: boolean}
